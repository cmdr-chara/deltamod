<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading...</title>
</head>
<body>
    <img src="./logo.png" alt="" width="70" class="deltamodLogo">
</body>
<script>
    var doneAudio;

    function drawProgress(canvas, value) {
        const ctx = canvas.getContext("2d");
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const innerRadius = 50;
        const activePosition = (value / 100) * 50;
        const isComplete = value >= 100;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 50; i += 1) {
            const coverage = Math.max(0, Math.min(1, activePosition - i));
            const opacity = 0.38 + (coverage * 0.62);
            const height = 6 + (coverage * 8);
            const angle = (i / 50) * Math.PI * 2 - Math.PI / 2;
            const outerRadius = innerRadius + height;

            ctx.beginPath();
            ctx.moveTo(
                cx + Math.cos(angle) * innerRadius,
                cy + Math.sin(angle) * innerRadius
            );
            ctx.lineTo(
                cx + Math.cos(angle) * outerRadius,
                cy + Math.sin(angle) * outerRadius
            );
            ctx.lineWidth = 4;
            ctx.strokeStyle = isComplete
                ? `rgba(127, 220, 255, ${opacity})`
                : `rgba(255, 255, 255, ${opacity})`;
            ctx.stroke();
        }
    }

    function animateProgress(canvas, value) {
        if (canvas.animationFrame) {
            cancelAnimationFrame(canvas.animationFrame);
        }

        const startValue = canvas.progressValue || 0;
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = reducedMotion ? 0 : 180;

        if (duration === 0 || startValue === value) {
            canvas.progressValue = value;
            drawProgress(canvas, value);
            return;
        }

        const startTime = performance.now();
        const tick = now => {
            const elapsed = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - elapsed, 3);
            const currentValue = startValue + ((value - startValue) * eased);
            drawProgress(canvas, currentValue);

            if (elapsed < 1) {
                canvas.animationFrame = requestAnimationFrame(tick);
                return;
            }

            canvas.animationFrame = 0;
            canvas.progressValue = value;
        };

        canvas.animationFrame = requestAnimationFrame(tick);
    }

    function getProgressCanvas(logo) {
        let canvas = document.getElementById("progressCircle");
        if (canvas) return canvas;

        canvas = document.createElement("canvas");
        canvas.id = "progressCircle";
        canvas.width = 200;
        canvas.height = 200;
        canvas.style.position = "fixed";
        canvas.style.zIndex = "3";
        canvas.style.pointerEvents = "none";
        canvas.progressValue = 0;
        document.body.appendChild(canvas);

        const placeCircle = () => {
            const bounds = logo.getBoundingClientRect();
            canvas.style.left = `${bounds.left + bounds.width / 2 - canvas.width / 2}px`;
            canvas.style.top = `${bounds.top + bounds.height / 2 - canvas.height / 2}px`;
        };

        placeCircle();
        window.addEventListener("resize", placeCircle);
        drawProgress(canvas, 0);
        return canvas;
    }

    function updateProgress(percent) {
        const value = Math.max(0, Math.min(100, Number(percent) || 0));
        const logo = document.querySelector(".deltamodLogo");
        if (!logo) return;

        if (percent >= 100 && !doneAudio) {
            doneAudio = new Audio("./done.mp3");
            doneAudio.volume = 0.5;
            doneAudio.playbackRate = 1.9;
            doneAudio.play();
        }

        logo.classList.toggle("complete", value >= 100);
        animateProgress(getProgressCanvas(logo), value);
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateProgress(0);
        window.progressAPI.onProgress(updateProgress);
    });
</script>
<style>
    @keyframes bodyAppear {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    body {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: transparent;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;

        background-image: url('./anotherhim.webp');
        background-size: cover;
        background-repeat: no-repeat;

        animation: bodyAppear 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .deltamodLogo {
        animation: rotate 2.6s infinite linear;
    }
    .deltamodLogo.complete {
        animation: none;
        filter: drop-shadow(0 0 8px rgba(127, 220, 255, 0.65));
    }
    .progbar {
        height: 9px;
        position: fixed;
        border-top-right-radius: 5px;
        border-bottom-right-radius: 5px;
        z-index: 2;
        bottom: 10px;
        left: 10px;
        background-color: rgba(255, 255, 255, 0.741);
    }
    @media (prefers-reduced-motion: reduce) {
        body,
        .deltamodLogo {
            animation: none;
        }
    }
</style>
</html>
