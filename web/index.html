<!DOCTYPE html>
<html lang="en">
<head id="head">
    <title>Deltamod Community</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' deltapack: themeprot: packet:; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: https://gamebanana.com https://images.gamebanana.com https://avatars.githubusercontent.com https://media.moddb.com https://static.moddb.com https://images.nexusmods.com https://staticdelivery.nexusmods.com deltapack: themeprot: packet:; media-src 'self' blob: deltapack: themeprot: packet:; connect-src 'self' ipc: http://ipc.localhost https://gamebanana.com deltapack: themeprot: packet:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-src https://gamebanana.com; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="modules/icons.css">
    <link rel="stylesheet" href="commons/base.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="linux-webkit-compat.css">
    <link rel="stylesheet" href="modules/seasonal-events.css">
    <link rel="stylesheet" href="boot/deltamod-boot.css">
    <link rel="stylesheet" href="styles/deltamod-revamp.css">

    <style id="deltamod-route-guard">html.deltamod-route-pending body { visibility: hidden; }</style>
    <script>document.documentElement.classList.add('deltamod-route-pending');</script>

    <script src="./tauri-adapter.js"></script>
    <script src="./media-compat.js"></script>
    <script src="./modules/chara-encounter-session.js"></script>
    <script src="./modules/tippy/popper.min.js"></script>
    <script src="./modules/tippy/tippy-bundle.umd.js"></script>
</head>
<body>
    <a class="skip-workspace" href="#workspace" data-i18n="ui_skip">Skip to content</a>
    <div
        id="deltamod-boot-root"
        role="status"
        aria-live="polite"
        aria-label="Starting Deltamod"
    ></div>
    <div
        id="deltamod-seasonal-layer"
        class="deltamod-seasonal-layer"
        aria-hidden="true"
        hidden
    ></div>
    <div class="bg"></div>
    <video
        id="theme-background-video"
        class="theme-background-video"
        muted
        loop
        playsinline
        preload="metadata"
        aria-hidden="true"
        hidden
    ></video>
    <div
        id="theme-sprite-layer"
        class="theme-sprite-layer"
        aria-hidden="true"
        hidden
    ></div>
    <div class="dmodicon" aria-hidden="true">
        <img
            src="./img/packIcon.png"
            class="dmodicon-ring"
            alt=""
            data-theme-sprite="soul"
            data-theme-sprite-source="./img/packIcon.png"
        >
        <img
            src="./img/packIcon.png"
            class="dmodicon-soul"
            alt=""
            data-theme-sprite="soul"
            data-theme-sprite-source="./img/packIcon.png"
        >
    </div>
    <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="title" style="justify-content: left; -webkit-app-region: drag !important;">
            <p id="pageTitle">Home</p>
        </div>
        <div class="barbtns">
            <button onclick="toggleMinimize()" class="bar-button minimize-button" title="Minimize" aria-label="Minimize">
                <svg class="window-control-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M3 11.5h10" />
                </svg>
            </button>
            <button onclick="toggleFullscreen()" class="bar-button maximize-button" title="Maximize" aria-label="Maximize">
                <svg class="window-control-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <rect x="3.5" y="3.5" width="9" height="9" rx="1" />
                </svg>
            </button>
            <button onclick="closeCommunity()" class="bar-button close-button" title="Close" aria-label="Close">
                <svg class="window-control-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="m4 4 8 8M12 4l-8 8" />
                </svg>
            </button>
        </div>
    </div>
    <div class="viewport" id="workspace" role="region" aria-labelledby="pageTitle" tabindex="-1">
        <div class="loadingBar">
            
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-brand"><img src="./img/packIcon.png" alt="" width="32" height="32" data-theme-sprite="soul" data-theme-sprite-source="./img/packIcon.png"><span>Deltamod</span></div>
        <nav class="sidebar-buttons" aria-label="Main navigation">
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_play" data-page="main" aria-label="Home">
                <img src="sbar/main.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/main.png">
                <span class="sidebar-label" data-i18n="ui_nav_play">Play & patch</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_library" data-page="allmods" aria-label="Mod library">
                <img src="sbar/allmods.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/allmods.png">
                <span class="sidebar-label" data-i18n="ui_nav_library">Mod library</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_games" data-page="installmanager" aria-label="Installation manager">
                <img src="sbar/installmanager.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/installmanager.png">
                <span class="sidebar-label" data-i18n="ui_nav_games">Installations</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_shop" id="shopRibbon" data-page="gamebanana-browse" aria-label="Mod Shop">
                <img src="sbar/shop.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/shop.png">
                <span class="sidebar-label" data-i18n="ui_nav_shop">Mod Shop</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_collections" style="display: none;" id="collectionsRibbon" data-page="collections" aria-label="Collections">
                <img src="sbar/collections.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/collections.png">
                <span class="sidebar-label" data-i18n="ui_nav_collections">Collections</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="options" data-page="options" aria-label="Options">
                <img src="sbar/options.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/options.png">
                <span class="sidebar-label" data-i18n="options">Options</span>
            </button>
            <button class="sidebar-button" type="button" data-i18n-aria-label="ui_nav_about" data-page="credits" aria-label="Information and credits">
                <img src="sbar/credits.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/credits.png">
                <span class="sidebar-label" data-i18n="ui_nav_about">About</span>
            </button>
        </nav>
    </div>
    <button
        id="language-wheel-toggle"
        class="language-wheel-toggle"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="language-wheel"
    >
        <img id="language-wheel-toggle-flag" src="assets/language-flags/en.svg" alt="">
        <span class="language-toggle-label" data-i18n="language_switcher_label">Change language</span>
    </button>
    <div id="language-wheel-backdrop" class="language-wheel-backdrop" hidden></div>
    <div
        id="language-wheel"
        class="language-wheel"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        hidden
    >
        <div class="language-wheel-ring" aria-hidden="true"></div>
        <svg
            id="language-wheel-sectors"
            class="language-wheel-sectors"
            viewBox="0 0 330 330"
            aria-hidden="true"
        ></svg>
        <div class="language-wheel-options" id="language-wheel-options"></div>
        <div class="language-wheel-indicator" aria-hidden="true"></div>
        <div class="language-wheel-current" aria-live="polite">
            <img id="language-wheel-current-flag" src="langs/en/flag.png" alt="">
        </div>
    </div>
    <div class="gamebanana-account" role="button" tabindex="0" aria-label="GameBanana account" title="GameBanana account" style="opacity: 0;"></div>
    <div class="alertMain" hidden>
        <div class="alertMsg"></div>
    </div>
<div class="winb">
    
</div>
<div class="glyph">

</div>
  <style id="dynamic-theme-styles"></style>
  <script src="./modules/startup.js"></script>
</body>
</html>
