<!DOCTYPE html>
<html lang="en">
<head id="head">
    <title>Deltamod Community</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' deltapack: themeprot: packet:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://gamebanana.com https://images.gamebanana.com https://avatars.githubusercontent.com https://media.moddb.com https://static.moddb.com https://images.nexusmods.com https://staticdelivery.nexusmods.com deltapack: themeprot: packet:; media-src 'self' deltapack: themeprot:; connect-src 'self' https://gamebanana.com deltapack: themeprot: packet:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-src https://gamebanana.com; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="commons/base.css">
    <link rel="stylesheet" href="index.css">

    <script src="./modules/tippy/popper.min.js"></script>
    <script src="./modules/tippy/tippy-bundle.umd.js"></script>
</head>
<body>
    <div class="bg"></div>
    <video
        id="theme-background-video"
        class="theme-background-video"
        muted
        loop
        playsinline
        preload="metadata"
        aria-hidden="true"
        hidden
    ></video>
    <img
        src="./img/packIcon.png"
        class="dmodicon"
        alt=""
        aria-hidden="true"
        data-theme-sprite="soul"
        data-theme-sprite-source="./img/packIcon.png"
    >
    <div class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="title" style="justify-content: left; -webkit-app-region: drag !important;">
            <p id="pageTitle">Home</p>
        </div>
        <div class="barbtns">
            <button onclick="toggleMinimize()" class="bar-button minimize-button" title="Minimize" aria-label="Minimize">
                <span class="material-symbols-outlined">minimize</span>
            </button>
            <button onclick="toggleFullscreen()" class="bar-button maximize-button" title="Maximize" aria-label="Maximize">
                <span class="material-symbols-outlined">crop_square</span>
            </button>
            <button onclick="window.close()" class="bar-button close-button" title="Close" aria-label="Close">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
    </div>
    <div class="viewport">
        <div class="loadingBar">
            
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-buttons">
            <button class="sidebar-button" data-page="main" aria-label="Home" title="Home">
                <img src="sbar/main.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/main.png">
            </button>

            <button class="sidebar-button" data-page="allmods" aria-label="Mod library" title="Mod library">
                <img src="sbar/allmods.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/allmods.png">
            </button>

            <button class="sidebar-button" data-page="options" aria-label="Options" title="Options">
                <img src="sbar/options.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/options.png">
            </button>
            
            <button class="sidebar-button" data-page="installmanager" aria-label="Installation manager" title="Installation manager">
                <img src="sbar/installmanager.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/installmanager.png">
            </button>

            <!-- JS should display this if user toggled GameBanana specific features -->
            <button class="sidebar-button" id="shopRibbon" data-page="gamebanana-browse" aria-label="Mod Shop" title="Mod Shop">
                <img src="sbar/shop.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/shop.png">
            </button>

            <button class="sidebar-button" style="display: none;" id="collectionsRibbon" data-page="collections" aria-label="Collections" title="Collections">
                <img src="sbar/collections.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/collections.png">
            </button>

            <button class="sidebar-button" data-page="credits" aria-label="Information and credits" title="Information and credits">
                <img src="sbar/credits.png" alt="" width="26" data-theme-sprite="accent" data-theme-sprite-source="sbar/credits.png">
            </button>
        </div>
    </div>
    <button
        id="language-wheel-toggle"
        class="language-wheel-toggle"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="language-wheel"
    >
        <img id="language-wheel-toggle-flag" src="langs/en/flag.png" alt="">
    </button>
    <div id="language-wheel-backdrop" class="language-wheel-backdrop" hidden></div>
    <div
        id="language-wheel"
        class="language-wheel"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        hidden
    >
        <div class="language-wheel-ring" aria-hidden="true"></div>
        <svg
            id="language-wheel-sectors"
            class="language-wheel-sectors"
            viewBox="0 0 330 330"
            aria-hidden="true"
        ></svg>
        <div class="language-wheel-options" id="language-wheel-options"></div>
        <div class="language-wheel-indicator" aria-hidden="true"></div>
        <div class="language-wheel-current" aria-live="polite">
            <img id="language-wheel-current-flag" src="langs/en/flag.png" alt="">
        </div>
    </div>
    <div class="gamebanana-account" role="button" tabindex="0" aria-label="GameBanana account" title="GameBanana account" style="opacity: 0;"></div>
    <div class="alertMain" style="display: none;">
        <div class="alertMsg">
            <h1>Example Alert</h1>
            <p>This alert is an <b>example</b>.</p>
            <div style="text-align: right;">
                <button>OK</button>
            </div>
        </div>
    </div>
</body>
<div class="winb">
    
</div>
<div class="glyph">

</div>
  <style id="dynamic-theme-styles"></style>
  <script src="./modules/localization.js"></script>
  <script src="./modules/theme-sprites.js"></script>
  <script src="index.js"></script>
</html>
