<div class="content-page mods-page">
    <header class="patch-toolbar">
        <div class="patch-toolbar-copy">
            <h1 id="ptitle">$$main_title$$</h1>
            <div class="patch-sort-control">
                <label for="sortWay">$$sortBy$$</label>
                <select name="sortWay" id="sortWay">
                    <option value="asc">$$sort_asc$$</option>
                    <option value="desc">$$sort_desc$$</option>
                    <option value="size-asc">$$sort_sizeAsc$$</option>
                    <option value="size-desc">$$sort_sizeDesc$$</option>
                    <option value="author">$$sort_author$$</option>
                </select>
            </div>
        </div>
        <div class="patch-actions" aria-label="Patch actions">
            <button onclick="window.electronAPI.invoke('importMod',[])" id="importModBtn" title="Import a mod package" aria-label="Import a mod package">
                <span class="material-symbols-outlined">
                    add_box
                </span>
            </button>
            <button onclick="window.currentPageStack.patchAndRun()" id="par" title="Apply selected mods and launch" aria-label="Apply selected mods and launch">
                <span class="material-symbols-outlined">
                    arrow_circle_right
                </span>
            </button>
        </div>
    </header>
    <div class="mod-search-toolbar" hidden>
        <label for="mod-search" data-i18n="refine_search_mods">$$refine_search_mods$$</label>
        <input id="mod-search" type="search" autocomplete="off" placeholder="$$refine_search_hint$$" data-i18n-placeholder="refine_search_hint">
        <button id="clear-mod-search" class="secondary-action" type="button" hidden data-i18n="refine_clear">$$refine_clear$$</button>
        <output id="mod-search-count" for="mod-search" aria-live="polite"></output>
    </div>
    <div class="mods-scroll">
        <div style="display: none;" class="modlist-error" id="error-banner" role="button" tabindex="0">
            <h2>$$modFail_bannerTitle$$</h2>
            <span class="calibri">$$modFail_bannerClick$$</span>
        </div>
        <table id="modtable">
            <colgroup>
                <col class="patch-mod-column">
                <col class="patch-enabled-column">
            </colgroup>
            <thead>
                <tr>
                    <th>$$mod$$</th>
                    <th class="patch-enabled-heading">$$enabled$$</th>
                </tr>
            </thead>
            <tbody id="modlist">
            </tbody>
        </table>
    </div>

        <dialog class="error-list-dialog" id="error-list-dialog">
            <h2>$$modFail_dialogTitle$$</h2>
            <span class="calibri">$$modFail_dialogSubtitle$$</span>
            <div class="error-list-div" id="error-list-div">

            </div>
            <div class="error-buttons">
                <!-- forgive me for this MASSIVE onclick thing, but keeping this and allmods unified is a pain in the ass -->
                <button onclick="rew(); document.getElementById('error-list-dialog').style.animation = '0.3s closeError ease forwards'; setTimeout(() => { document.getElementById('error-list-dialog').close(); document.getElementById('error-list-dialog').style.animation = '0.3s openError ease forwards'; }, 300);" style="width: 100%; padding: 10px;">OK</button>
            </div>
        </dialog>
</div>
JSL
AUDIO[mainTheme.mp3]
STYLESHEET[main]
TITLE[$$main_title$$]
