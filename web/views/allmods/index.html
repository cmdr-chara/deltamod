<div class="content-page mods-page library-page">
    <div class="library-toolbar">
        <div class="page-heading">
            <h1>$$allModsTitle$$</h1>
            <p>$$community_allmods_subtitle$$</p>
        </div>
        <div class="library-filter">
            <label for="gamesShow">$$installation$$</label>
            <select name="gamesShow" id="gamesShow">
                <option value="all">$$installmanager_title$$</option>
            </select>
            <button
                id="installedModsV2Preview"
                class="secondary-action"
                type="button"
                title="Open the read-only Installed Mods v2 preview"
            >Preview new library</button>
        </div>
    </div>
    <div class="mods-scroll">
        <div style="display: none;" class="modlist-error" id="error-banner">
            <h2>$$modFail_bannerTitle$$</h2>
            <span class="calibri">$$modFail_bannerClick$$</span>
        </div>
        <table id="modtable">
            <colgroup>
                <col style="width: 85%;">
                <col style="width: 15%;">
            </colgroup>
            <thead style="position: sticky; top: -2px;">
                <tr>
                    <th>$$mod$$</th>
                    <th>$$actions$$</th>
                </tr>
            </thead>
            <tbody id="modlist">
            </tbody>
        </table>
    </div>

    <dialog class="error-list-dialog" id="error-list-dialog">
            <h2>$$modFail_dialogTitle$$</h2>
            <span class="calibri">$$modFail_dialogSubtitle$$</span>
            <div class="error-list-div" id="error-list-div">

            </div>
            <div class="error-buttons">
                <!-- forgive me for this MASSIVE onclick thing, but keeping this and allmods unified is a pain in the ass -->
                <button onclick="rew(); document.getElementById('error-list-dialog').style.animation = '0.3s closeError ease forwards'; setTimeout(() => { document.getElementById('error-list-dialog').close(); document.getElementById('error-list-dialog').style.animation = '0.3s openError ease forwards'; }, 300);" style="width: 100%; padding: 10px;">$$allmods_ok$$</button>
            </div>
        </dialog>
</div>
JSL
AUDIO[mainTheme.mp3]
STYLESHEET[../main/main]
TITLE[$$allModsTitle$$]
