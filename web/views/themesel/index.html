<main class="theme-browser product-ui">
<div class="theme-page-heading dm-section-heading">
    <div>
        <button class="theme-back-button secondary-action noScaleBTN" type="button" onclick="page('options')" data-i18n="back">$$back$$</button>
        <h1 data-i18n="themesel_title">$$themesel_title$$</h1>
        <p data-i18n="theme_intro">$$theme_intro$$</p>
    </div>
    <button id="open-theme-import" class="theme-create-button noScaleBTN" type="button" data-i18n="theme_create">$$theme_create$$</button>
</div>

<div class="theme-toolbar dm-surface">
    <label class="theme-search">
        <span data-i18n="theme_search">$$theme_search$$</span>
        <input id="theme-filter" type="search" placeholder="$$theme_filter_placeholder$$" data-i18n-placeholder="theme_filter_placeholder">
    </label>
    <span id="theme-count" aria-live="polite"></span>
    <div class="theme-categories" role="group" aria-label="Theme category">
        <button class="theme-category-button secondary-action noScaleBTN is-active" type="button" data-theme-category="all" aria-pressed="true">All</button>
        <button class="theme-category-button secondary-action noScaleBTN" type="button" data-theme-category="deltarune" aria-pressed="false">DELTARUNE</button>
        <button class="theme-category-button secondary-action noScaleBTN" type="button" data-theme-category="undertale" aria-pressed="false">UNDERTALE</button>
        <button class="theme-category-button secondary-action noScaleBTN" type="button" data-theme-category="custom" aria-pressed="false">Custom</button>
    </div>
</div>
<section id="themes" class="theme-grid" aria-label="$$theme_available$$" data-i18n-aria-label="theme_available"></section>
<div id="theme-empty" hidden>
    <h2 data-i18n="theme_no_matches">$$theme_no_matches$$</h2>
    <p data-i18n="theme_no_matches_hint">$$theme_no_matches_hint$$</p>
</div>
</main>

JSL
STYLESHEET[themesel]
TITLE[$$themesel_title$$]
AUDIO[views/options/ost.mp3]
