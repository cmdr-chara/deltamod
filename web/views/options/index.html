<div class="content-page options-page">
    <div class="ingranaggio" aria-hidden="true">
        <span class="material-symbols-outlined">settings</span>
    </div>
    <div class="page-heading">
        <h1>$$options$$</h1>
        <p>$$community_options_subtitle$$</p>
    </div>
    <div class="options-layout">
        <nav class="cat" aria-label="Settings categories">
            <button onclick="window.currentPageStack.cat('gen')" id="b_gen" class="noScaleBTN">$$optcat_general$$</button>
            <button onclick="window.currentPageStack.cat('lang')" id="b_lang" class="noScaleBTN">$$optcat_lang$$</button>
            <button onclick="window.currentPageStack.cat('ui')" id="b_ui" class="noScaleBTN">$$optcat_ui$$</button>
            <button onclick="window.currentPageStack.cat('inst')" id="b_inst" class="noScaleBTN">$$optcat_installation$$</button>
            <button onclick="window.currentPageStack.cat('data')" id="b_data" class="noScaleBTN">$$optcat_data$$</button>
            <button onclick="window.currentPageStack.cat('adv')" id="b_adv" class="noScaleBTN">$$optcat_advanced$$</button>
            <button onclick="window.currentPageStack.cat('gb')" id="b_gb" class="noScaleBTN">$$optcat_gamebanana$$</button>
            <button onclick="window.currentPageStack.cat('nexus')" id="b_nexus" class="noScaleBTN">$$optcat_nexus$$</button>
            <button onclick="window.currentPageStack.cat('dev')" id="b_dev" style="display: none;" class="noScaleBTN">$$optcat_developer$$</button>
        </nav>
        <div class="opt">
            <table id="modtable">
                <colgroup>
                    <col style="width: 80%;">
                    <col style="width: 20%;">
                </colgroup>
                <thead style="position: sticky; top: -2px;">
                    <tr>
                        <th>$$option$$</th>
                        <th>$$status$$</th>
                    </tr>
                </thead>
                <tbody id="options">
                    <tr>
                        <td colspan="2" style="text-align: center;">$$optcat_selectone$$</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

STYLESHEET[options]
JSL
TITLE[Options]
AUDIO[views/options/ost.mp3]
