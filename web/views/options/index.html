<div class="content-page options-page">
    <div class="ingranaggio" aria-hidden="true">
        <span class="material-symbols-outlined">settings</span>
    </div>
    <div class="page-heading">
        <h1>Options</h1>
        <p>Configure Community without changing the official Deltamod profile.</p>
    </div>
    <div class="options-layout">
        <nav class="cat" aria-label="Settings categories">
            <button onclick="window.currentPageStack.cat('gen')" id="b_gen" class="noScaleBTN">General</button>
            <button onclick="window.currentPageStack.cat('ui')" id="b_ui" class="noScaleBTN">UI</button>
            <button onclick="window.currentPageStack.cat('inst')" id="b_inst" class="noScaleBTN">Installation</button>
            <button onclick="window.currentPageStack.cat('data')" id="b_data" class="noScaleBTN">Data</button>
            <button onclick="window.currentPageStack.cat('adv')" id="b_adv" class="noScaleBTN">Advanced</button>
            <button onclick="window.currentPageStack.cat('gb')" id="b_gb" class="noScaleBTN">GameBanana</button>
            <button onclick="window.currentPageStack.cat('nexus')" id="b_nexus" class="noScaleBTN">Nexus Mods</button>
            <button onclick="window.currentPageStack.cat('dev')" id="b_dev" style="display: none;" class="noScaleBTN">Developer</button>
        </nav>
        <div class="opt">
            <table id="modtable">
                <colgroup>
                    <col style="width: 80%;">
                    <col style="width: 20%;">
                </colgroup>
                <thead style="position: sticky; top: -2px;">
                    <tr>
                        <th>Option</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="options">
                    <tr>
                        <td colspan="2" style="text-align: center;">Select a category on the left to view the options.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

STYLESHEET[options]
JSL
TITLE[Options]
AUDIO[views/options/ost.mp3]
