<div>
    <h1>$$locate_title$$</h1>
    <p class="calibri">$$locate_desc$$</p>
    <hr>
    <div>
        <p style="display: flex; justify-content: left; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined">gamepad_up</span>
        $$locate_selectgame$$
        </p>
        <div class="gOptions">

        </div>
        <p style="display: flex; justify-content: left; align-items: center; gap: 10px;">
        <span class="material-symbols-outlined">folder</span>
        $$locate_selectfolder$$
        </p>
        <div class="fileInput" style="display: flex; justify-content: left; align-items: stretch; gap: 5px;">
            <input type="text" name="" id="dpath" placeholder="$$locate_path_placeholder$$" style="width: 100%;">
            <button class="folder-picker-button" onclick="window.currentPageStack.locateDelta()" aria-label="Select game folder">
                <span class="material-symbols-outlined">folder_open</span>
            </button>
        </div>
        <p class="smaller">$$locate_other_methods$$</p>
        <div class="otherImports">
            <button onclick="window.currentPageStack.steam()" id="feat_steam">
                <brand-icon style="font-size: 14px;">S</brand-icon> $$locate_steam_import$$
            </button>
            <button onclick="window.currentPageStack.downloadDelta()" id="feat_autodownload">
                <span class="material-symbols-outlined" style="font-size: 14px;">cloud_download</span> $$locate_autodownload$$
            </button>
        </div>
    </div>
    <br>
    <hr>
    <div class="copyAnyways">
        <input type="checkbox" name="" id="copyAnyways">
        <label for="copyAnyways">$$locate_copyanyways$$</label>
    </div>
    <section id="gameImportProgress" class="importProgress" hidden aria-live="polite">
        <div><strong id="gameImportPhase">Preparing import…</strong> <span id="gameImportAmount"></span></div>
        <progress id="gameImportBar" value="0" max="1"></progress>
        <small id="gameImportFile" class="calibri"></small>
        <button id="cancelGameImport" type="button">Cancel import</button>
    </section>
    <br>
    <button onclick="window.currentPageStack.id()">$$save_and_close$$</button>
    <br><br>
</div>
<style>
    .gameIco {
        width: 30px;
        opacity: 0.4;
        padding: 10px;
        border-radius: var(--control-radius);
        background: transparent;
        cursor: pointer;
        transition:
            background-color var(--motion-fast) var(--motion-ease-out),
            box-shadow var(--motion-fast) var(--motion-ease-out),
            opacity var(--motion-fast) linear;
    }
    .gameIco:hover {
        opacity: 0.8;
        background: rgba(255, 255, 255, 0.08);
    }
    .gameIco.selectedGameIco {
        opacity: 1;
        background: var(--theme-color-point2);
        box-shadow: inset 0 0 0 2px var(--theme-color);
    }
    .copyAnyways {
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 10px;
        cursor: pointer;
    }
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
    }
    .otherImports {
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }
    .otherImports > button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
    }
    .folder-picker-button {
        flex: 0 0 40px;
        width: 40px;
        min-height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        line-height: 0;
    }
    .folder-picker-button > .material-symbols-outlined {
        display: block;
        width: 20px;
        height: 20px;
        font-size: 20px;
        line-height: 20px;
        text-align: center;
    }
    .smaller {
        font-size: 14px;
    }
    .gOptions {
        width: auto;
        height: 50px;
        padding: 10px;
        background: rgba(0,0,0,0.5);
        border-radius: 10px;
        display: flex;
        justify-content: left;
        align-items: center;
        gap: 20px;
        border: 1px solid var(--theme-color);
    }
    .importProgress {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
    }
    .importProgress progress {
        display: block;
        width: 100%;
        margin: 8px 0;
    }
    .importProgress small {
        display: block;
        overflow-wrap: anywhere;
        margin-bottom: 8px;
    }
</style>
JSL
AUDIO[mainTheme.mp3]
TITLE[$$locate_title$$]
