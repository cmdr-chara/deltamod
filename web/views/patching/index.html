<section class="content-page task-page patching-page">
    <header class="page-heading">
        <h1 id="patchingTXT" role="status" data-i18n="ui_patching">$$ui_patching$$</h1>
        <p id="patchingDesc">Please wait while the selected mods are applied. Keep Deltamod open until this finishes.</p>
    </header>
    <div class="patch-progress-heading"><label for="patch-progress" data-i18n="ui_progress">$$ui_progress$$</label><output id="patch-percent" for="patch-progress"></output></div>
    <progress id="patch-progress" max="100" aria-label="$$ui_progress$$"></progress>
    <section class="patch-log-section" aria-labelledby="patch-log-heading">
        <h2 id="patch-log-heading" data-i18n="ui_log">$$ui_log$$</h2>
        <div class="logs" id="gpl" tabindex="0" aria-label="$$ui_log$$"></div>
    </section>
    <div class="task-actions"><button type="button" onclick="window.currentPageStack.next()" id="next" hidden>Open game</button></div>
</section>
JSL
NO-SIDEBAR
STYLESHEET[style]
TITLE[Patching]
AUDIO[views/patching/patching.mp3]
