[package]
name = "deltamod-mods-themes-runtime"
version = "0.1.0"
edition = "2021"
description = "Filesystem-backed runtime adapter for Deltamod mods, themes, and preferences"
license = "EUPL-1.2"

[dependencies]
deltamod-mods-themes-domain = { package = "deltamod-mods-themes-domain", path = "../mods-themes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
