[package]
name = "deltamod-lifecycle-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Transactional lifecycle runtime for Deltamod"
license = "EUPL-1.2"
publish = false

[dependencies]
deltamod-product-contracts = { path = "../product-contracts" }
deltamod-tools-runtime = { path = "../tools-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
fence-windows = "0.1.0-alpha.2"
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
