[package]
name = "deltamod-game-download-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.23"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
