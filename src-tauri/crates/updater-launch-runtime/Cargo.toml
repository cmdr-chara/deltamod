[package]
name = "deltamod-updater-launch-runtime"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Owned cross-platform game launch and verified updater runtime"

[features]
default = []
tauri-adapter = ["dep:base64", "dep:minisign-verify", "dep:reqwest", "dep:tokio"]

[dependencies]
serde_json = "1"
base64 = { version = "0.23", optional = true }
minisign-verify = { version = "=0.3.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
