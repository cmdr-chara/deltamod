[package]
name = "deltamod-theme-recipes"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Rights-gated local theme extraction recipes for Deltamod"
license = "EUPL-1.2"
publish = false

[dependencies]
deltamod-product-contracts = { path = "../product-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
deltamod-mods-themes-runtime = { path = "../mods-themes-runtime" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
