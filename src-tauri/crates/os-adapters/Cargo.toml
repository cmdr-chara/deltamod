[package]
name = "deltamod-tauri-os-adapters"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
tauri-adapter = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", optional = true, default-features = false }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-opener = { version = "2.5.4", optional = true }
url = "2"

[lints.rust]
unsafe_code = "forbid"
