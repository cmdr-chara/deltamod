[package]
name = "deltamod-archive-import-runtime"
version = "0.1.0"
edition = "2021"
description = "Memory-bounded, traversal-safe native mod archive importer for Deltamod"
license = "EUPL-1.2"
publish = false

[dependencies]
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
lzma-rs = "=0.3.0"
sevenz-rust2 = { version = "=0.21.4", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
toml = "=1.1.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }

[dev-dependencies]
deltamod-game-download-runtime = { path = "../game-download-runtime" }
deltamod-network-runtime = { path = "../network-runtime" }
deltamod-tauri-os-adapters = { path = "../os-adapters" }
serde_json = "1"
sevenz-rust2 = { version = "=0.21.4", default-features = false, features = ["compress", "util"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
