[package]
name = "deltamod-patching-runtime"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Transactional legacy-compatible game patching and hash runtime"

[dependencies]
deltamod-hash-worker = { path = "../../../native/hash-worker" }
deltamod-lifecycle-runtime = { path = "../lifecycle-runtime" }
deltamod-native-core = { path = "../../../native/core" }
deltamod-product-contracts = { path = "../product-contracts" }
deltamod-tools-runtime = { path = "../tools-runtime" }
deltamod-updater-launch-runtime = { path = "../updater-launch-runtime" }
roxmltree = "0.21"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1"
