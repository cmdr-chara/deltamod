[package]
name = "deltamod-native-core"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
fence-windows = "0.1.0-alpha.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
