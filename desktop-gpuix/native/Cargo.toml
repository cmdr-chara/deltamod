[package]
name = "deltamod-gpuix-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "EUPL-1.2"
publish = false

# Separate workspace: the preview must not rewrite production dependency locks.
[workspace]
resolver = "2"

# Dependency workspaces do not propagate their patches to this root. Preserve
# the production GLib soundness fix while the backend still depends on Tauri.
[patch.crates-io]
glib = { path = "../../vendor/glib-0.18.5-patched" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"
deltamod-storage-domain = { path = "../../src-tauri/crates/storage" }
deltamod-mods-themes-domain = { path = "../../src-tauri/crates/mods-themes" }
deltamod-network-runtime = { path = "../../src-tauri/crates/network-runtime" }
deltamod-tauri-shell = { path = "../../src-tauri" }

[profile.release]
codegen-units = 1
lto = true
strip = true
