[package]
name = "deltamod-gpuix-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "EUPL-1.2"
publish = false

# Separate workspace: the preview must not rewrite production dependency locks.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"
deltamod-storage-domain = { path = "../../src-tauri/crates/storage" }
deltamod-mods-themes-domain = { path = "../../src-tauri/crates/mods-themes" }
deltamod-network-runtime = { path = "../../src-tauri/crates/network-runtime" }
# Retain the existing Rust import alias only. The resolved package is the
# independent runtime, with no Tauri build script, plugins, Wry or WebView.
deltamod-tauri-shell = { package = "deltamod-app-runtime", path = "../../native/app-runtime" }

[profile.release]
codegen-units = 1
lto = true
strip = true
