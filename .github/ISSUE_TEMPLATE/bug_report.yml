name: Bug report
description: Report a reproducible Deltamod Community problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Deltamod Community.
        Do not attach copyrighted game data, account cookies, API keys, or other credentials.
        Report security vulnerabilities privately by following SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Deltamod Community version
      description: Find this in the app or on the release page you downloaded from.
      placeholder: 2.0.18
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: System details
      description: Include your Linux distribution, desktop, or other relevant system details.
      placeholder: Ubuntu 24.04, GNOME 46
  - type: input
    id: game
    attributes:
      label: Game and game version
      placeholder: DELTARUNE 1.04
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: Mod and source
      description: Include the mod name and its GameBanana, ModDB, Nexus Mods, or other source URL when relevant.
      placeholder: Example Mod — https://...
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain what you observed and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove usernames, private paths, tokens, cookies, and game data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched for an existing report before opening this issue.
          required: true
        - label: I reproduced this with the latest stable release or recommended preview.
          required: true
        - label: I removed credentials and copyrighted game files from this report.
          required: true
