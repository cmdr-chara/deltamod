name: Temporary reliability follow-up

on:
  push:
    branches:
      - fix/reliability-findings

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reliability-findings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Close fallback cleanup edge case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('native/core/src/patch_transaction.rs')
          text = path.read_text()
          old = '''    fs::remove_dir_all(&backup_root).ok();
              fs::remove_file(journal_path)?;
              Ok(())
          }'''
          new = '''    fs::remove_dir_all(&backup_root).ok();
              fs::remove_file(journal_path)?;
              let fallback = journal_backup_path(journal_path);
              if fallback.exists() {
                  let _ = fs::remove_file(&fallback);
              }
              let _ = fs::remove_file(journal_path.with_extension("json.tmp"));
              let _ = sync_parent(journal_path);
              Ok(())
          }'''
          if text.count(old) != 1:
              raise SystemExit('restore cleanup target did not match exactly once')
          text = text.replace(old, new, 1)

          old_assert = '''        assert_eq!(fs::read(game.join("data.win")).unwrap(), b"original");
              assert!(!journal_path.exists());'''
          new_assert = '''        assert_eq!(fs::read(game.join("data.win")).unwrap(), b"original");
              assert!(!journal_path.exists());
              assert!(!journal_backup_path(&journal_path).exists());'''
          if text.count(old_assert) != 1:
              raise SystemExit('regression assertion target did not match exactly once')
          path.write_text(text.replace(old_assert, new_assert, 1))
          PY
          cargo fmt --all --manifest-path native/Cargo.toml
          test "$(git diff --name-only)" = "native/core/src/patch_transaction.rs"
      - name: Publish follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/core/src/patch_transaction.rs
          git commit -m "fix: clear consumed journal fallbacks"
          git push origin HEAD:fix/reliability-findings
