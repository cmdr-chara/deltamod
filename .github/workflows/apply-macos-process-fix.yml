name: Apply macOS process cleanup fix

on:
  push:
    branches: [release/2.0.18-macos-process-fix]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/2.0.18-macos-process-fix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply bounded fix
        run: python3 .github/apply-macos-process-fix.py
      - name: Format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Stress short-lived overflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            cargo test --locked --manifest-path src-tauri/Cargo.toml -p deltamod-tools-runtime --test fake_process aggregate_output_overflow_is_structured_and_terminates -- --exact
          done
      - name: Run complete process containment suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p deltamod-tools-runtime --test fake_process
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-macos-process-race.yml
          rm -f .github/workflows/apply-macos-process-fix.yml
          rm -f .github/apply-macos-process-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(runtime): stabilize short-lived Darwin process cleanup'
          git push origin HEAD:release/2.0.18-macos-process-fix
