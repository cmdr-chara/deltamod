name: Native Fuzz Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/native-fuzz.yml'
      - 'src-tauri/fuzz/**'
      - 'src-tauri/crates/product-contracts/src/path_boundary.rs'
      - 'src-tauri/crates/protocol/src/lib.rs'
      - 'src-tauri/crates/updater-launch-runtime/src/steam_discovery.rs'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: native parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: nightly
      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz bounded native parsers
        run: >-
          cargo +nightly fuzz run
          --fuzz-dir src-tauri/fuzz
          native_inputs --
          -runs=5000
          -max_len=1048576
          -timeout=5
          -rss_limit_mb=2048
