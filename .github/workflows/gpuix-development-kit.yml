name: GPUIX isolated development inputs
on:
  pull_request:
    paths: ['.github/workflows/gpuix-development-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Collect exact source and resolve independent preview dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpuix-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/gpuix-inputs/source-revision.txt"
          git archive HEAD desktop-gpuix src-tauri native games AGENTS.md CONTRIBUTING.md web/themes/data web/langs .github/workflows/gpuix-preview.yml | gzip > "$RUNNER_TEMP/gpuix-inputs/source.tar.gz"
          npm install --prefix desktop-gpuix --no-audit --no-fund
          cp desktop-gpuix/package-lock.json "$RUNNER_TEMP/gpuix-inputs/package-lock.json"
          tar -C desktop-gpuix -czf "$RUNNER_TEMP/gpuix-inputs/node_modules.tar.gz" node_modules
          cargo generate-lockfile --manifest-path desktop-gpuix/native/Cargo.toml
          cp desktop-gpuix/native/Cargo.lock "$RUNNER_TEMP/gpuix-inputs/Cargo.lock"
          cargo fetch --locked --manifest-path desktop-gpuix/native/Cargo.toml
      - name: Capture native baseline independently from frontend typechecking
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path desktop-gpuix/native/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/gpuix-inputs/native-baseline.log"
      - name: Retain public build inputs for offline focused verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gpuix-inputs"
          rustc --version --verbose > "$RUNNER_TEMP/gpuix-inputs/toolchain.txt"
          sysroot="$(rustc --print sysroot)"
          tar -C "$sysroot" --exclude='share/doc' --exclude='lib/rustlib/src' -czf "$RUNNER_TEMP/gpuix-inputs/rust-toolchain.tar.gz" bin lib share
          # Do not archive cargo configuration, credentials, home or Actions tokens.
          if [ -d "$HOME/.cargo/registry" ]; then
            tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/gpuix-inputs/cargo-registry.tar.gz" registry
          fi
          cd "$RUNNER_TEMP/gpuix-inputs"
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gpuix-development-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/gpuix-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
