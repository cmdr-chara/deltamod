name: GPUIX isolated development inputs
on:
  pull_request:
    paths: ['.github/workflows/gpuix-development-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Fetch the existing locked native dependencies for offline migration work
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          output="$RUNNER_TEMP/gpuix-inputs"
          mkdir -p "$output"
          tar -C "$HOME/.cargo" -czf "$output/cargo-registry.tar.gz" registry
          cp src-tauri/Cargo.lock "$output/tauri-Cargo.lock"
          git rev-parse HEAD > "$output/source-revision.txt"
          cd "$output"
          sha256sum cargo-registry.tar.gz tauri-Cargo.lock source-revision.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpuix-native-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/gpuix-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
