name: GPUIX isolated development inputs
on:
  pull_request:
    paths: ['.github/workflows/gpuix-development-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Collect missing native renderer prerequisite and exact repository notices
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gpuix-inputs"
          mkdir -p "$output/debs"
          cd "$output/debs"
          apt-get download libllvm20
          cd "$GITHUB_WORKSPACE"
          paths=(package.json LICENSE.txt)
          for file in NOTICE.md THIRD_PARTY_NOTICES.md COPYRIGHT.md LICENSING.md ORIGINAL_WORK.md provenance/community-original-work.json scripts/verify-community-provenance.js; do
            if git cat-file -e "HEAD:$file" 2>/dev/null; then paths+=("$file"); fi
          done
          git archive HEAD "${paths[@]}" | gzip > "$output/notices.tar.gz"
          cd "$output"
          find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpuix-renderer-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/gpuix-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
