name: Isolated GPUIX Wayland inputs
on:
  push:
    branches: [astra/gpuix-wayland-inputs]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retain Debian compositor dependencies for native validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wayland-inputs"
          docker run --rm -v "$RUNNER_TEMP/wayland-inputs:/out" debian:trixie-slim sh -ec '
            printf "Acquire::Retries \"2\"; Acquire::http::Timeout \"30\";\n" > /etc/apt/apt.conf.d/99-bounds
            apt-get update
            apt-get install --download-only --no-install-recommends -y weston libegl-mesa0
            mkdir -p /out/root
            for package in /var/cache/apt/archives/*.deb; do
              dpkg-deb -x "$package" /out/root
              dpkg-deb -f "$package" Package Version >> /out/packages.txt
            done
            tar -C /out/root -czf /out/wayland-runtime.tar.gz .
            rm -rf /out/root
            cd /out
            sha256sum wayland-runtime.tar.gz packages.txt > SHA256SUMS.txt
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpuix-wayland-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/wayland-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
