name: GPUIX native media sources
on:
  push:
    branches: [astra/gpuix-inputs-20260930-2]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acquire immutable native audio and decoder sources
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/media-sources"
          mkdir -p "$output/miniaudio"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://raw.githubusercontent.com/mackron/miniaudio/9634bedb5b5a2ca38c1ee7108a9358a4e233f14d/miniaudio.h' -o "$output/miniaudio/miniaudio.h"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://raw.githubusercontent.com/mackron/miniaudio/9634bedb5b5a2ca38c1ee7108a9358a4e233f14d/LICENSE' -o "$output/miniaudio/LICENSE"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz' -o "$output/ffmpeg-8.1.3.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz.asc' -o "$output/ffmpeg-8.1.3.tar.xz.asc"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://ffmpeg.org/ffmpeg-devel.asc' -o "$output/ffmpeg-devel.asc"
          export GNUPGHOME="$RUNNER_TEMP/gpuix-source-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import "$output/ffmpeg-devel.asc"
          gpg --batch --status-fd=1 --verify "$output/ffmpeg-8.1.3.tar.xz.asc" "$output/ffmpeg-8.1.3.tar.xz" > "$output/source-verification.txt"
          cd "$output"
          sha256sum miniaudio/* ffmpeg* source-verification.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gpuix-media-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/media-sources/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
