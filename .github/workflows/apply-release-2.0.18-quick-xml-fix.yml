name: Apply release 2.0.18 quick-xml compatibility fix

on:
  push:
    branches:
      - release/2.0.18-quick-xml-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/2.0.18-quick-xml-fix
          fetch-depth: 0
      - name: Apply bounded quick-xml migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/crates/network-runtime/src/lib.rs')
          text = path.read_text()

          def replace_exact(old: str, new: str, count: int) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, new)

          replace_exact(
              '''fn decode_xml_text(value: &[u8]) -> String {\n    let value = String::from_utf8_lossy(value);\n    quick_xml::escape::unescape(&value)\n        .map(|value| value.into_owned())\n        .unwrap_or_else(|_| value.into_owned())\n}''',
              '''fn decode_xml_text(value: &str) -> String {\n    quick_xml::escape::unescape(value)\n        .map(|value| value.into_owned())\n        .unwrap_or_else(|_| value.to_owned())\n}''',
              1,
          )
          replace_exact(
              'tag = String::from_utf8_lossy(e.name().as_ref()).into();',
              'tag = e.name().as_ref().to_owned();',
              1,
          )
          replace_exact('e.name().as_ref() == b"item"', 'e.name().as_ref() == "item"', 2)
          replace_exact(
              'matches!(e.name().as_ref(), b"enclosure" | b"media:content")',
              'matches!(e.name().as_ref(), "enclosure" | "media:content")',
              2,
          )
          replace_exact(
              'attribute.key.as_ref() == b"url"',
              'attribute.key.as_ref() == "url"',
              2,
          )
          replace_exact(
              '''.map(|attribute| {\n                            String::from_utf8_lossy(attribute.value.as_ref()).into_owned()\n                        });''',
              '.map(|attribute| attribute.value.into_owned());',
              1,
          )
          replace_exact(
              '''.map(|attribute| {\n                        String::from_utf8_lossy(attribute.value.as_ref()).into_owned()\n                    });''',
              '.map(|attribute| attribute.value.into_owned());',
              1,
          )
          replace_exact(
              'summary = Some(strip_markup(&String::from_utf8_lossy(e.as_ref())));',
              'summary = Some(strip_markup(e.as_ref()));',
              1,
          )
          replace_exact(
              '<title>Example mod</title><link>https://www.moddb.com/mods/example</link>',
              '<title>Example &amp; mod</title><link>https://www.moddb.com/mods/example</link>',
              1,
          )
          replace_exact(
              '''        assert_eq!(entries.len(), 1);\n        assert_eq!(\n            entries[0].image_url.as_deref(),''',
              '''        assert_eq!(entries.len(), 1);\n        assert_eq!(entries[0].title, "Example & mod");\n        assert_eq!(\n            entries[0].image_url.as_deref(),''',
              1,
          )

          path.write_text(text)
          PY
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-release-2.0.18-quick-xml-fix.yml
          git add src-tauri/crates/network-runtime/src/lib.rs
          git commit -m 'fix(network): migrate ModDB parser to quick-xml 0.42'
          git push origin HEAD:release/2.0.18-quick-xml-fix
