name: Agent patch runner

on:
  push:
    branches:
      - cmdr-chara/roadmap-contract-freeze
    paths:
      - .github/workflows/agent-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cmdr-chara/roadmap-contract-freeze
          fetch-depth: 0

      - name: Apply focused test patch
        run: python scripts/agent-patch-provider-fixture.py

      - name: Validate patched test
        run: |
          node --check tests/e2e/community-smoke.spec.js
          git diff --check

      - name: Commit fix and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-patch.yml scripts/agent-patch-provider-fixture.py
          git add tests/e2e/community-smoke.spec.js
          git commit -m "test: mock GameBanana provider bridge"
          git push origin HEAD:cmdr-chara/roadmap-contract-freeze
