name: Apply release 2.0.18 rustfmt fix

on:
  push:
    branches:
      - release/2.0.18-quick-xml-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/2.0.18-quick-xml-fix
          fetch-depth: 0
      - name: Apply rustfmt layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/crates/network-runtime/src/lib.rs')
          text = path.read_text()
          old = '''                } else if inside_item\n                    && matches!(e.name().as_ref(), "enclosure" | "media:content")\n                {'''
          new = '''                } else if inside_item && matches!(e.name().as_ref(), "enclosure" | "media:content")\n                {'''
          actual = text.count(old)
          if actual != 1:
              raise SystemExit(f'expected one rustfmt target, found {actual}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-release-2.0.18-rustfmt.yml
          git add src-tauri/crates/network-runtime/src/lib.rs
          git commit -m 'style(network): apply rustfmt layout'
          git push origin HEAD:release/2.0.18-quick-xml-fix
