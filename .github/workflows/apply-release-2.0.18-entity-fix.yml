name: Apply release 2.0.18 entity event fix

on:
  push:
    branches:
      - release/2.0.18-quick-xml-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release/2.0.18-quick-xml-fix
          fetch-depth: 0
      - name: Apply entity-aware text accumulation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/crates/network-runtime/src/lib.rs')
          text = path.read_text()

          def replace_exact(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, new)

          replace_exact('reader.config_mut().trim_text(true);', 'reader.config_mut().trim_text(false);')
          replace_exact(
              '''                match tag.as_str() {\n                    "title" => title = Some(v),\n                    "link" => link = Some(v),\n                    "pubDate" => pubd = Some(v),\n                    "description" => summary = Some(v),\n                    _ => {}\n                }\n            }\n            Ok(quick_xml::events::Event::CData(e)) if inside_item && tag == "description" => {''',
              '''                match tag.as_str() {\n                    "title" => title.get_or_insert_with(String::new).push_str(&v),\n                    "link" => link.get_or_insert_with(String::new).push_str(&v),\n                    "pubDate" => pubd.get_or_insert_with(String::new).push_str(&v),\n                    "description" => summary.get_or_insert_with(String::new).push_str(&v),\n                    _ => {}\n                }\n            }\n            Ok(quick_xml::events::Event::GeneralRef(e)) if inside_item => {\n                let v = decode_xml_text(&format!("&{};", e.as_ref()));\n                match tag.as_str() {\n                    "title" => title.get_or_insert_with(String::new).push_str(&v),\n                    "link" => link.get_or_insert_with(String::new).push_str(&v),\n                    "pubDate" => pubd.get_or_insert_with(String::new).push_str(&v),\n                    "description" => summary.get_or_insert_with(String::new).push_str(&v),\n                    _ => {}\n                }\n            }\n            Ok(quick_xml::events::Event::CData(e)) if inside_item && tag == "description" => {'''
          )
          replace_exact(
              '''                    out.push(ModEntry {\n                        title: t,\n                        link: l,\n                        published: pubd.take(),\n                        summary: summary.take(),\n                        image_url: image_url.take(),\n                    })\n                }\n                inside_item = false;\n            }\n            Ok(quick_xml::events::Event::Eof) => break,''',
              '''                    out.push(ModEntry {\n                        title: t.trim().to_owned(),\n                        link: l.trim().to_owned(),\n                        published: pubd.take().map(|value| value.trim().to_owned()),\n                        summary: summary.take().map(|value| value.trim().to_owned()),\n                        image_url: image_url.take(),\n                    })\n                }\n                inside_item = false;\n            }\n            Ok(quick_xml::events::Event::End(e))\n                if inside_item && e.name().as_ref() == tag.as_str() =>\n            {\n                tag.clear();\n            }\n            Ok(quick_xml::events::Event::Eof) => break,'''
          )

          path.write_text(text)
          PY
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit entity-aware parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-release-2.0.18-entity-fix.yml
          git add src-tauri/crates/network-runtime/src/lib.rs
          git commit -m 'fix(network): preserve XML entity text fragments'
          git push origin HEAD:release/2.0.18-quick-xml-fix
