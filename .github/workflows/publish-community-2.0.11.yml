# Registered-workflow retrigger for the validated 2.0.11 publication.
name: Publish Deltamod Community 2.0.11

on:
  push:
    branches: [DeltaMaster]
    paths:
      - .github/workflows/publish-community-2.0.11.yml

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: DeltaMaster
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify release inputs
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag='community-v2.0.11'
          expected_sha='b15a0a57e92b443013b85a168160f7f208d75b07'
          source_run='32172472816'

          if release_json="$(gh api "repos/cmdr-chara/deltamod/releases/tags/$tag" 2>/dev/null)"; then
            url="$(printf '%s' "$release_json" | jq -r '.html_url')"
            gh api --method POST "repos/cmdr-chara/deltamod/statuses/$SHA" \
              -f state=success -f context='release-manual-publish' \
              -f description='release-already-published' -f target_url="$url"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
          actual_sha="$(git rev-list -n 1 "$tag")"
          test "$actual_sha" = "$expected_sha"

          artifacts="$(gh api "repos/cmdr-chara/deltamod/actions/runs/$source_run/artifacts?per_page=100")"
          for name in windows-nsis linux-deb macos-x64-dmg macos-arm64-dmg; do
            count="$(printf '%s' "$artifacts" | jq -r --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            test "$count" -eq 1
          done

          git show "$tag:CHANGELOG.txt" > /tmp/release-notes.txt
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"

      - name: Download validated package artifacts
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.preflight.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for name in windows-nsis linux-deb macos-x64-dmg macos-arm64-dmg; do
            gh run download "$SOURCE_RUN" --repo cmdr-chara/deltamod --name "$name" --dir release-artifacts
          done

      - name: Build corresponding-source archives
        if: steps.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run archive:g3mtool-source -- "$PWD/release-artifacts/G3MTool-1.2.5-source.zip"
          npm run archive:undertale-mod-tool-source -- "$PWD/release-artifacts/UndertaleModTool-0.9.1.2-source.zip"

      - name: Prepare SHA-256 manifest
        if: steps.preflight.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          printf 'Release files before checksum: %s\n' "${#artifacts[@]}"
          find release-artifacts -type f -printf '%f\n' | sort
          test "${#artifacts[@]}" -eq 7
          (cd release-artifacts && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Attest release artifacts
        if: steps.preflight.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*

      - name: Publish stable release
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          test "${#artifacts[@]}" -eq 8
          gh release create community-v2.0.11 "${artifacts[@]}" \
            --verify-tag --latest \
            --notes-file /tmp/release-notes.txt \
            --title 'Deltamod Community 2.0.11 (unsigned)'

          release_json="$(gh api 'repos/cmdr-chara/deltamod/releases/tags/community-v2.0.11')"
          test "$(printf '%s' "$release_json" | jq -r '.draft')" = false
          test "$(printf '%s' "$release_json" | jq -r '.prerelease')" = false
          test "$(printf '%s' "$release_json" | jq -r '.assets | length')" -eq 8
          url="$(printf '%s' "$release_json" | jq -r '.html_url')"
          gh api --method POST "repos/cmdr-chara/deltamod/statuses/$SHA" \
            -f state=success -f context='release-manual-publish' \
            -f description='community-v2.0.11-published-with-8-assets' \
            -f target_url="$url"

      - name: Record publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/cmdr-chara/deltamod/statuses/$SHA" \
            -f state=failure -f context='release-manual-publish' \
            -f description='community-v2.0.11-publication-failed' \
            -f target_url="https://github.com/cmdr-chara/deltamod/actions"
