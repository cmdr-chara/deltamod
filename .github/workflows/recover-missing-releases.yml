name: Recover unpublished stable releases

on:
  push:
    branches:
      - fix/release-publisher-recovery
    paths:
      - .github/workflows/recover-missing-releases.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-unpublished-community-releases
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Recover existing immutable tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fixed_archiver="$GITHUB_WORKSPACE/scripts/archive-undertale-mod-tool-source.js"
          test -f "$fixed_archiver"

          recover_tag() {
            local tag="$1"
            local latest="$2"
            local tag_sha
            local runs_json
            local run_id
            local jobs_json
            local work
            local tagged_source
            local artifact_count
            local -a release_args
            local -a artifacts

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag is already published; skipping recovery."
              return 0
            fi

            git fetch origin "refs/tags/$tag:refs/tags/$tag" --force
            tag_sha="$(git rev-list -n 1 "$tag")"
            test -n "$tag_sha"

            runs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/tauri-release.yml/runs" \
              -f branch="$tag" \
              -f event=workflow_dispatch \
              -f per_page=50)"
            run_id="$(jq -r --arg sha "$tag_sha" '
              .workflow_runs
              | map(select(.head_sha == $sha))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"$runs_json")"
            if [ -z "$run_id" ]; then
              echo "No stable-release workflow run found for $tag at $tag_sha" >&2
              exit 1
            fi
            echo "Recovering $tag from workflow run $run_id ($tag_sha)."

            jobs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
              -f per_page=100)"
            jq -e '[.jobs[] | select(.name == "validate" and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null
            jq -e '[.jobs[] | select((.name | startswith("package (")) and .conclusion == "success")] | length == 4' \
              <<<"$jobs_json" >/dev/null

            work="$RUNNER_TEMP/recover-${tag//[^A-Za-z0-9._-]/_}"
            tagged_source="$work/tag-source"
            rm -rf "$work"
            mkdir -p "$work/release-artifacts"

            for artifact in windows-nsis linux-deb macos-x64-dmg macos-arm64-dmg; do
              gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact" \
                --dir "$work/release-artifacts"
            done

            git worktree add --detach "$tagged_source" "$tag"
            cp "$fixed_archiver" "$tagged_source/scripts/archive-undertale-mod-tool-source.js"

            (
              cd "$tagged_source"
              npm ci
              npm run archive:g3mtool-source -- \
                "$work/release-artifacts/G3MTool-1.2.5-source.zip"
              npm run archive:undertale-mod-tool-source -- \
                "$work/release-artifacts/UndertaleModTool-0.9.1.2-source.zip"
            )

            artifact_count="$(find "$work/release-artifacts" -type f | wc -l | tr -d ' ')"
            if [ "$artifact_count" -ne 7 ]; then
              echo "Expected 7 release payloads for $tag, found $artifact_count" >&2
              find "$work/release-artifacts" -type f -print >&2
              exit 1
            fi

            (
              cd "$work/release-artifacts"
              find . -type f ! -name SHA256SUMS.txt -print0 \
                | sort -z \
                | xargs -0 sha256sum > SHA256SUMS.txt
            )

            mapfile -d '' artifacts < <(find "$work/release-artifacts" -type f -print0)
            if [ "${#artifacts[@]}" -ne 8 ]; then
              echo "Expected 8 payloads including SHA256SUMS.txt for $tag" >&2
              exit 1
            fi

            release_args=()
            if [ "$latest" = "true" ]; then
              release_args+=(--latest)
            fi

            gh release create "$tag" "${artifacts[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              "${release_args[@]}" \
              --notes-file "$tagged_source/CHANGELOG.txt" \
              --title "Deltamod Community ${tag#community-v} (unsigned)"

            git worktree remove --force "$tagged_source"
            rm -rf "$work"
          }

          recover_tag community-v2.0.13 false
          recover_tag community-v2.0.14 true
