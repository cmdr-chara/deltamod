name: GPUIX preview validation
on:
  pull_request:
    paths:
      - 'desktop-gpuix/**'
      - '.github/workflows/gpuix-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpuix-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop-gpuix
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      # Stage-1 dependency resolution is diagnostic, not a locked release build.
      # Retain the resolved locks for review instead of silently committing them.
      - name: Resolve the isolated preview dependencies
        run: npm install --no-audit --no-fund
      - name: Check transport and state on Windows
        run: npm test
      - name: Compile against the actual GPUIX React types
        run: npm run build
      - name: Check the native host and source-profile protection
        run: cargo test --release --manifest-path native/Cargo.toml
      - name: Build the preview's Rust host
        run: npm run native
      - name: Exercise actual native navigation and GPU screenshots
        run: npm run smoke -- smoke-results
      - name: Retain native evidence and resolved dependency locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gpuix-preview-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop-gpuix/smoke-results/
            desktop-gpuix/package-lock.json
            desktop-gpuix/native/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
