name: Temporary rustfmt fix

on:
  push:
    branches:
      - fix/reliability-findings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reliability-findings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and verify Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          test "$(git diff --name-only)" = "src-tauri/crates/archive-import-runtime/src/lib.rs"
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - name: Publish formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/crates/archive-import-runtime/src/lib.rs
          git commit -m "style: apply rustfmt to cleanup callback"
          git push origin HEAD:fix/reliability-findings
