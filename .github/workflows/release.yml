name: Community Beta Release (Unsigned)

on:
  push:
    tags:
      - community-electron-beta-v*

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - run: npm ci
      - name: Require tag and package versions to match
        run: node -e "const p=require('./package.json'); const m=/^community-electron-beta-v(.+)$/.exec(process.env.GITHUB_REF_NAME); if(!m || m[1]!==p.version) throw new Error(`Tag does not match package ${p.version}`)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm run verify:g3mtool-manifest
      - run: npm run verify:undertale-mod-tool-manifest

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - run: npm run acquire:undertale-mod-tool
      - run: npm run verify:undertale-mod-tool
      - run: npm run smoke:game-patching-csx
      - run: npm run build-windows
      - run: node scripts/verify-packaged-hash-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - run: node scripts/verify-packaged-security-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - run: node scripts/verify-packaged-copy-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - run: node scripts/verify-packaged-patch-plan-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - run: node scripts/verify-packaged-patch-transaction-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - run: node scripts/verify-packaged-undertale-mod-tool.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
      - name: Verify unsigned beta installer
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path dist -Filter *.exe -File
          if (-not $executables) { throw "No Windows installer was produced." }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Beta artifacts must be intentionally unsigned, but $($executable.Name) has status $($signature.Status)."
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - run: npm run acquire:undertale-mod-tool
      - run: npm run verify:undertale-mod-tool
      - run: npm run smoke:game-patching-csx
      - run: npm run build-linux
      - run: node scripts/verify-packaged-undertale-mod-tool.js "dist/linux-unpacked/resources/app.asar.unpacked" linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/latest-linux.yml

  package-macos:
    needs: validate
    runs-on: macos-26
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Electron workflow smoke test
        run: npm run test:e2e
      - name: Acquire native Apple Silicon patcher
        run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - name: Acquire Intel patcher for the x64 package
        run: node scripts/acquire-g3mtool.js darwin-x64
      - name: Acquire Intel UndertaleModCli for the x64 package
        run: node scripts/acquire-undertale-mod-tool.js darwin-x64
      - name: Verify complete Intel UndertaleModCli package tree
        run: node scripts/verify-undertale-mod-tool.js darwin-x64 --tree-only
      - run: npm run build-macos
      - run: node scripts/verify-packaged-undertale-mod-tool.js "dist/mac/Deltamod Community.app/Contents/Resources/app.asar.unpacked" darwin-x64 --tree-only
      - run: node scripts/verify-packaged-undertale-mod-tool.js "dist/mac-arm64/Deltamod Community.app/Contents/Resources/app.asar.unpacked" darwin-x64 --tree-only
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  third-party-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run archive:g3mtool-source -- "G3MTool-1.2.5-source.zip"
      - run: npm run archive:undertale-mod-tool-source -- "UndertaleModTool-0.9.1.2-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-source
          path: |
            G3MTool-1.2.5-source.zip
            UndertaleModTool-0.9.1.2-source.zip

  publish:
    needs: [package-windows, package-linux, package-macos, third-party-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create SHA-256 manifest
        shell: bash
        run: (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
      - name: Publish unsigned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --prerelease --notes-file CHANGELOG.txt --title "Deltamod Community ${GITHUB_REF_NAME#community-electron-beta-v} (Unsigned Electron Beta)"
