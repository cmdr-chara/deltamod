name: Community Beta Release (Unsigned)

on:
  push:
    tags:
      - community-v*

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require tag and package versions to match
        run: node -e "const p=require('./package.json'); const t=process.env.GITHUB_REF_NAME.replace(/^community-v/,''); if(t!==p.version) throw new Error(`Tag ${t} does not match package ${p.version}`)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm run verify:g3mtool-manifest

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - run: npm run build-windows
      - name: Verify unsigned beta installer
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path dist -Filter *.exe -File
          if (-not $executables) { throw "No Windows installer was produced." }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Beta artifacts must be intentionally unsigned, but $($executable.Name) has status $($signature.Status)."
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - run: npm run build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/latest-linux.yml

  third-party-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run archive:g3mtool-source -- "G3MTool-1.2.5-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-source
          path: G3MTool-1.2.5-source.zip

  publish:
    needs: [package-windows, package-linux, third-party-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish unsigned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --prerelease --notes-file CHANGELOG.txt --title "Deltamod Community ${GITHUB_REF_NAME#community-v} (Unsigned Beta)"
