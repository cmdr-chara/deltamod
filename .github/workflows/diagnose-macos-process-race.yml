name: Diagnose macOS process race

on:
  push:
    branches:
      - release/2.0.18-macos-process-fix

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Add diagnostic output locally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/crates/tools-runtime/tests/fake_process.rs')
          text = path.read_text()
          old = '    let error = run_bounded(&spec, Duration::from_secs(5), 1000).unwrap_err();\n'
          new = old + '    eprintln!("observed overflow result: {error:?}");\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target line, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Stress focused overflow test
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            echo "=== iteration $i ==="
            cargo test --locked --manifest-path src-tauri/Cargo.toml -p deltamod-tools-runtime --test fake_process aggregate_output_overflow_is_structured_and_terminates -- --exact --nocapture
          done
