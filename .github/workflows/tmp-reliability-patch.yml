name: Temporary reliability patch

on:
  push:
    branches:
      - fix/reliability-findings

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reliability-findings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded reliability fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact match(es), found {actual}")
              p.write_text(text.replace(old, new, count))

          core = "native/core/src/patch_transaction.rs"
          replace_exact(
              core,
              "use std::fs;\nuse std::io;\nuse std::path::{Component, Path, PathBuf};",
              "use std::fs::{self, File};\nuse std::io::{self, Write};\nuse std::path::{Component, Path, PathBuf};",
          )

          old_writer = '''fn write_journal(path: &Path, journal: &Journal) -> Result<(), TransactionError> {
              let bytes = serde_json::to_vec(journal).map_err(|_| TransactionError::Invalid)?;
              let temp = path.with_extension("json.tmp");
              fs::write(&temp, &bytes)?;
              fs::rename(temp, path)?;
              Ok(())
          }'''
          new_writer = '''fn journal_backup_path(path: &Path) -> PathBuf {
              path.with_extension("json.bak")
          }

          #[cfg(unix)]
          fn sync_parent(path: &Path) -> Result<(), TransactionError> {
              let parent = path.parent().ok_or(TransactionError::Invalid)?;
              File::open(parent)?.sync_all()?;
              Ok(())
          }

          #[cfg(not(unix))]
          fn sync_parent(_path: &Path) -> Result<(), TransactionError> {
              Ok(())
          }

          fn read_journal_file(path: &Path) -> Result<Journal, TransactionError> {
              let metadata = fs::symlink_metadata(path)?;
              if !metadata.is_file() || metadata.file_type().is_symlink() {
                  return Err(TransactionError::Invalid);
              }
              serde_json::from_slice(&fs::read(path)?).map_err(|_| TransactionError::Invalid)
          }

          pub fn load_journal(path: &Path) -> Result<Option<Journal>, TransactionError> {
              let backup = journal_backup_path(path);
              if !path.exists() {
                  if !backup.exists() {
                      return Ok(None);
                  }
                  let metadata = fs::symlink_metadata(&backup)?;
                  if !metadata.is_file() || metadata.file_type().is_symlink() {
                      return Err(TransactionError::Invalid);
                  }
                  fs::rename(&backup, path)?;
                  sync_parent(path)?;
              }
              let journal = read_journal_file(path)?;
              if backup.exists() {
                  let _ = fs::remove_file(&backup);
                  let _ = sync_parent(path);
              }
              Ok(Some(journal))
          }

          pub fn write_journal(path: &Path, journal: &Journal) -> Result<(), TransactionError> {
              let bytes = serde_json::to_vec(journal).map_err(|_| TransactionError::Invalid)?;
              let parent = path.parent().ok_or(TransactionError::Invalid)?;
              fs::create_dir_all(parent)?;
              let temp = path.with_extension("json.tmp");
              let backup = journal_backup_path(path);

              let mut file = File::create(&temp)?;
              file.write_all(&bytes)?;
              file.flush()?;
              file.sync_all()?;
              drop(file);

              if !path.exists() && backup.exists() {
                  fs::rename(&backup, path)?;
                  sync_parent(path)?;
              }

              if !path.exists() {
                  fs::rename(&temp, path)?;
                  if let Err(error) = sync_parent(path) {
                      let _ = fs::remove_file(path);
                      let _ = fs::remove_file(&temp);
                      return Err(error);
                  }
                  return Ok(());
              }

              if backup.exists() {
                  fs::remove_file(&backup)?;
              }
              fs::rename(path, &backup)?;
              if let Err(error) = sync_parent(path) {
                  let _ = fs::rename(&backup, path);
                  let _ = fs::remove_file(&temp);
                  return Err(error);
              }
              if let Err(error) = fs::rename(&temp, path) {
                  let _ = fs::rename(&backup, path);
                  let _ = fs::remove_file(&temp);
                  return Err(TransactionError::Io(error));
              }

              // Once the new primary exists, an fsync failure is no longer a failed
              // transaction: the synced backup remains a recoverable fallback.
              if sync_parent(path).is_ok() {
                  let _ = fs::remove_file(&backup);
                  let _ = sync_parent(path);
              }
              Ok(())
          }'''
          replace_exact(core, old_writer, new_writer)

          core_text = Path(core).read_text()
          if "missing_primary_recovers_from_backup_and_restores" in core_text:
              raise SystemExit("core regression test already exists unexpectedly")
          core_test = r'''

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn missing_primary_recovers_from_backup_and_restores() {
                  let root = tempfile::tempdir().unwrap();
                  let game = root.path();
                  let journal_path = game.join(".deltamod-community-patch-journal.json");
                  let backup_root = game
                      .join(".deltamod-community-patch-backups")
                      .join("1-1");
                  fs::create_dir_all(&backup_root).unwrap();
                  fs::write(game.join("data.win"), b"patched").unwrap();
                  fs::write(backup_root.join("data.win"), b"original").unwrap();

                  let journal = Journal {
                      schema_version: 1,
                      transaction_id: "1-1".into(),
                      state: "patched".into(),
                      started_at: None,
                      completed_at: None,
                      operations: vec![Operation {
                          kind: "restore".into(),
                          target: "data.win".into(),
                          backup: Some("data.win".into()),
                          state: "applied".into(),
                      }],
                  };
                  write_journal(&journal_path, &journal).unwrap();

                  let fallback = journal_backup_path(&journal_path);
                  fs::rename(&journal_path, &fallback).unwrap();
                  assert!(!journal_path.exists());
                  assert!(fallback.exists());

                  let mut recovered = load_journal(&journal_path).unwrap().unwrap();
                  assert!(journal_path.exists());
                  assert!(!fallback.exists());
                  restore(game, &journal_path, &mut recovered).unwrap();

                  assert_eq!(fs::read(game.join("data.win")).unwrap(), b"original");
                  assert!(!journal_path.exists());
              }
          }
          '''
          Path(core).write_text(core_text + core_test)

          patching = "src-tauri/crates/patching-runtime/src/lib.rs"
          replace_exact(
              patching,
              "    patch_transaction::{backup, restore, Journal},",
              "    patch_transaction::{backup, load_journal, restore, write_journal, Journal},",
          )
          replace_exact(
              patching,
              "        atomic_json(&journal_path, &journal)?;",
              '''        write_journal(&journal_path, &journal)
                      .map_err(|error| Error::Transaction(error.to_string()))?;''',
              count=2,
          )
          old_restore = '''fn restore_existing(root: &Path) -> Result<(), Error> {
              let path = root.join(JOURNAL_NAME);
              if !path.exists() {
                  return Ok(());
              }
              let mut journal: Journal =
                  serde_json::from_slice(&fs::read(&path)?).map_err(|e| Error::Transaction(e.to_string()))?;
              restore(root, &path, &mut journal).map_err(|e| Error::Transaction(e.to_string()))
          }'''
          new_restore = '''fn restore_existing(root: &Path) -> Result<(), Error> {
              let path = root.join(JOURNAL_NAME);
              let Some(mut journal) =
                  load_journal(&path).map_err(|error| Error::Transaction(error.to_string()))?
              else {
                  return Ok(());
              };
              restore(root, &path, &mut journal).map_err(|error| Error::Transaction(error.to_string()))
          }'''
          replace_exact(patching, old_restore, new_restore)

          archive = "src-tauri/crates/archive-import-runtime/src/lib.rs"
          old_commit = '''fn commit(source: PathBuf, destination: &Path, replacing: bool) -> Result<(), ImportError> {
              if !replacing {
                  return fs::rename(source, destination).map_err(ImportError::Io);
              }
              let parent = destination
                  .parent()
                  .ok_or(ImportError::Destination("destination has no parent"))?;
              let backup = Builder::new().prefix(".mod-backup-").tempdir_in(parent)?;
              fs::remove_dir(backup.path())?;
              let backup_path = backup.keep();
              fs::rename(destination, &backup_path)?;
              if let Err(error) = fs::rename(&source, destination) {
                  let _ = fs::rename(&backup_path, destination);
                  let _ = fs::remove_dir_all(source);
                  return Err(ImportError::Io(error));
              }
              fs::remove_dir_all(backup_path)?;
              Ok(())
          }'''
          new_commit = '''fn commit(source: PathBuf, destination: &Path, replacing: bool) -> Result<(), ImportError> {
              commit_with_cleanup(source, destination, replacing, fs::remove_dir_all)
          }

          fn commit_with_cleanup<F>(
              source: PathBuf,
              destination: &Path,
              replacing: bool,
              cleanup_backup: F,
          ) -> Result<(), ImportError>
          where
              F: FnOnce(&Path) -> io::Result<()>,
          {
              if !replacing {
                  return fs::rename(source, destination).map_err(ImportError::Io);
              }
              let parent = destination
                  .parent()
                  .ok_or(ImportError::Destination("destination has no parent"))?;
              let backup = Builder::new().prefix(".mod-backup-").tempdir_in(parent)?;
              fs::remove_dir(backup.path())?;
              let backup_path = backup.keep();
              fs::rename(destination, &backup_path)?;
              if let Err(error) = fs::rename(&source, destination) {
                  let _ = fs::rename(&backup_path, destination);
                  let _ = fs::remove_dir_all(source);
                  return Err(ImportError::Io(error));
              }

              // Publication already succeeded. Backup cleanup is best-effort so a
              // cleanup failure cannot be reported as an installation failure.
              let _ = cleanup_backup(&backup_path);
              Ok(())
          }'''
          replace_exact(archive, old_commit, new_commit)

          marker = '''    #[test]
              fn downloaded_import_commits_validated_legacy_source_metadata() {'''
          archive_test = '''    #[test]
              fn cleanup_failure_after_replace_does_not_report_commit_failure() {
                  let root = tempfile::tempdir().unwrap();
                  let destination = root.path().join("installed");
                  let source = root.path().join("replacement");
                  fs::create_dir(&destination).unwrap();
                  fs::create_dir(&source).unwrap();
                  fs::write(destination.join("value"), b"old").unwrap();
                  fs::write(source.join("value"), b"new").unwrap();

                  commit_with_cleanup(source, &destination, true, |_| {
                      Err(io::Error::other("injected cleanup failure"))
                  })
                  .unwrap();

                  assert_eq!(fs::read(destination.join("value")).unwrap(), b"new");
              }

              #[test]
              fn downloaded_import_commits_validated_legacy_source_metadata() {'''
          replace_exact(archive, marker, archive_test)
          PY

          cargo fmt --all --manifest-path native/Cargo.toml
          cargo fmt --all --manifest-path src-tauri/Cargo.toml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            native/core/src/patch_transaction.rs \
            src-tauri/crates/archive-import-runtime/src/lib.rs \
            src-tauri/crates/patching-runtime/src/lib.rs | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected changed files after patching:" >&2
            git status --short >&2
            exit 1
          fi
      - name: Run focused native transaction tests
        run: cargo test --locked --manifest-path native/Cargo.toml -p deltamod-native-core
      - name: Run focused Tauri runtime tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p deltamod-archive-import-runtime -p deltamod-patching-runtime
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            native/core/src/patch_transaction.rs \
            src-tauri/crates/archive-import-runtime/src/lib.rs \
            src-tauri/crates/patching-runtime/src/lib.rs
          git commit -m "fix: harden patch recovery and archive commits"
          git push origin HEAD:fix/reliability-findings
