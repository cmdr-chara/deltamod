name: Community Tauri Release

on:
  push:
    tags:
      - community-v*
      - community-tauri-preview-v*
  workflow_dispatch:
    inputs:
      release_mode:
        description: Publish a stable tag or an isolated signed-updater rehearsal
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rehearsal

permissions:
  contents: read

concurrency:
  group: community-tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      rehearsal: ${{ steps.release.outputs.rehearsal }}
      unsigned_preview: ${{ steps.release.outputs.unsigned_preview }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              "$source"
          done
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run acquire:undertale-mod-tool
      - run: npm run build:native-sidecars:target -- x86_64-unknown-linux-gnu
      - run: npm run build:tauri:resources -- x86_64-unknown-linux-gnu
      - name: Resolve release identity and validate manifests
        id: release
        shell: bash
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'stable' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == community-tauri-preview-v* ]]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF_TYPE" = tag
            release_tag="$GITHUB_REF_NAME"
            preview_version="${release_tag#community-tauri-preview-v}"
            release_version="${preview_version%%-run-*}"
            rehearsal=false
            unsigned_preview=true
          elif [ "$RELEASE_MODE" = rehearsal ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF_TYPE" = branch
            test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
            release_version="$(node -p "require('./package.json').version")"
            release_tag="updater-rehearsal-v${release_version}-run-${GITHUB_RUN_ID}"
            rehearsal=true
            unsigned_preview=false
          else
            test "$RELEASE_MODE" = stable
            test "$GITHUB_REF_TYPE" = tag
            release_tag="$GITHUB_REF_NAME"
            release_version="${release_tag#community-v}"
            rehearsal=false
            unsigned_preview=false
          fi
          RELEASE_TAG="$release_tag" RELEASE_VERSION="$release_version" node <<'NODE'
          const fs = require('node:fs');
          const releaseTag = process.env.RELEASE_TAG;
          const releaseVersion = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(releaseVersion)) {
            throw new Error(`Release version must be stable semver; received ${releaseVersion}`);
          }
          const stableTag = `community-v${releaseVersion}`;
          const escapedVersion = releaseVersion.replaceAll('.', '\\.');
          const unsignedPreviewTag = new RegExp(`^community-tauri-preview-v${escapedVersion}(?:-run-[1-9]\\d*)?$`);
          const rehearsalTag = new RegExp(`^updater-rehearsal-v${releaseVersion.replaceAll('.', '\\.')}-run-\\d+$`);
          if (releaseTag !== stableTag && !unsignedPreviewTag.test(releaseTag) && !rehearsalTag.test(releaseTag)) {
            throw new Error(`Release tag is not bound to ${releaseVersion}: ${releaseTag}`);
          }
          const packageVersion = require('./package.json').version;
          const tauriVersion = require('./src-tauri/tauri.conf.json').version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = /^version\s*=\s*"([^"]+)"/m.exec(cargo)?.[1];
          const versions = { release: releaseVersion, package: packageVersion, cargo: cargoVersion, tauri: tauriVersion };
          if (Object.values(versions).some(version => version !== releaseVersion)) {
            throw new Error(`Release requires every manifest and tag to match: ${JSON.stringify(versions)}`);
          }
          const config = require('./src-tauri/tauri.conf.json');
          const windows = require('./src-tauri/tauri.windows.conf.json');
          const macos = require('./src-tauri/tauri.macos.conf.json');
          if (config.bundle?.active !== true || config.bundle?.createUpdaterArtifacts !== false
              || windows.bundle?.createUpdaterArtifacts !== true
              || macos.bundle?.createUpdaterArtifacts !== true) {
            throw new Error('Updater artifacts must be enabled only for Windows and macOS.');
          }
          NODE
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$rehearsal" >> "$GITHUB_OUTPUT"
          echo "unsigned_preview=$unsigned_preview" >> "$GITHUB_OUTPUT"
      - name: Require release-signing credentials
        if: steps.release.outputs.unsigned_preview != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { printf 'Missing required release credential: %s\n' "$name" >&2; exit 1; }
          done
      - run: cargo fmt --all --check --manifest-path native/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --workspace --all-targets --locked --manifest-path native/Cargo.toml
      - run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml
      - run: npm test
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm run verify:g3mtool-manifest
      - run: npm run verify:undertale-mod-tool-manifest
      - run: npm run verify:tauri:contract

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-nsis
            bundles: nsis
            smoke_executable: src-tauri/target/x86_64-pc-windows-msvc/release/deltamod-tauri-shell.exe
          # Ubuntu 22.04 provides the FUSE/runtime baseline expected by
          # linuxdeploy's AppImage bundle on GitHub-hosted runners.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-deb
            bundles: deb
            smoke_executable: src-tauri/target/x86_64-unknown-linux-gnu/release/deltamod-tauri-shell
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64-dmg
            bundles: app,dmg
            smoke_executable: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Deltamod Community.app/Contents/MacOS/Deltamod Community
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64-dmg
            bundles: app,dmg
            smoke_executable: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Deltamod Community.app/Contents/MacOS/Deltamod Community
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      TAURI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              "$source"
          done
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            desktop-file-utils xdg-utils \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: npm run acquire:g3mtool
      - run: npm run verify:g3mtool-manifest
      - run: npm run acquire:undertale-mod-tool
        if: matrix.target != 'aarch64-apple-darwin'
      - run: npm run verify:undertale-mod-tool-manifest
        if: matrix.target != 'aarch64-apple-darwin'
      - run: npm run build:boot
      - run: npm run build:native-sidecars:target -- ${{ matrix.target }}
      - run: npm run build:tauri:resources -- ${{ matrix.target }}
      - run: npm run build:tauri:butler -- ${{ matrix.target }}
      - run: npm run verify:tauri-staging -- ${{ matrix.target }}
      - name: Run target-native worker boundary tests
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }} --manifest-path native/Cargo.toml
      - name: Run target-native Tauri lifecycle and shell tests
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - name: Prepare platform signing configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/deltamod-platform-signing.json"
          if [ "${{ needs.validate.outputs.unsigned_preview }}" = true ]; then
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > "$config"
          else
            printf '%s\n' '{}' > "$config"
          fi
          printf 'TAURI_PLATFORM_SIGNING_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Import Windows publisher certificate
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'deltamod-publisher.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            $certificate = $imported | Where-Object {
              $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')
            } | Select-Object -First 1
            if (-not $certificate) { throw 'The imported PFX has no code-signing private key.' }
            [ordered]@{
              bundle = [ordered]@{
                windows = [ordered]@{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = 'sha256'
                  timestampUrl = 'http://timestamp.digicert.com'
                }
              }
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $env:TAURI_PLATFORM_SIGNING_CONFIG -Encoding utf8
            "DELTAMOD_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && needs.validate.outputs.unsigned_preview != 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/deltamod-developer-id.p12"
          keychain="$RUNNER_TEMP/deltamod-release.keychain-db"
          trap 'rm -f -- "$certificate"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          test -n "$identity" || { printf '%s\n' 'No Developer ID Application identity was imported.' >&2; exit 1; }
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
      - name: Build signed update-capable bundle
        if: runner.os != 'Linux' && needs.validate.outputs.unsigned_preview != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ env.TAURI_PLATFORM_SIGNING_CONFIG }}
      - name: Build Linux manual-download bundle
        if: runner.os == 'Linux' && needs.validate.outputs.unsigned_preview != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Build unsigned manual-download bundle
        if: needs.validate.outputs.unsigned_preview == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ env.TAURI_PLATFORM_SIGNING_CONFIG }}
      - name: Verify signed release package
        if: needs.validate.outputs.unsigned_preview != 'true'
        run: node scripts/verify-tauri-package.js "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ matrix.target }}"
      - name: Verify unsigned preview package
        if: needs.validate.outputs.unsigned_preview == 'true'
        run: node scripts/verify-tauri-package.js "src-tauri/target/${{ matrix.target }}/release/bundle" "${{ matrix.target }}" --unsigned
      - name: Verify Windows publisher signatures
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            Get-Item -LiteralPath "src-tauri/target/${{ matrix.target }}/release/deltamod-tauri-shell.exe"
            Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' -File | Select-Object -First 1
          )
          if ($targets.Count -ne 2 -or $targets -contains $null) { throw 'Windows signing targets are incomplete.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:DELTAMOD_WINDOWS_CERT_THUMBPRINT) {
              throw "Publisher signature verification failed for $($target.Name)."
            }
          }
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && needs.validate.outputs.unsigned_preview != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Deltamod Community.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Verify Windows preview is intentionally unsigned
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            Get-Item -LiteralPath "src-tauri/target/${{ matrix.target }}/release/deltamod-tauri-shell.exe"
            Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' -File | Select-Object -First 1
          )
          if ($targets.Count -ne 2 -or $targets -contains $null) { throw 'Windows preview targets are incomplete.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned preview artifact $($target.Name) unexpectedly has signature status $($signature.Status)."
            }
          }
      - name: Verify macOS preview is not notarized
        if: runner.os == 'macOS' && needs.validate.outputs.unsigned_preview == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Deltamod Community.app"
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            printf '%s\n' 'Unsigned preview unexpectedly contains a Developer ID signature.' >&2
            exit 1
          fi
          if xcrun stapler validate "$app"; then
            printf '%s\n' 'Unsigned preview unexpectedly contains a notarization ticket.' >&2
            exit 1
          fi
      - name: Install, smoke, and uninstall Windows NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' -File | Select-Object -First 1
          if (-not $bundle) { throw 'The Windows NSIS bundle was not found.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deltamod-installed-windows'
          $dataRoot = Join-Path $env:RUNNER_TEMP "deltamod-smoke-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $installRoot, $dataRoot | Out-Null
          $installer = Start-Process -FilePath $bundle.FullName -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($installer.ExitCode)" }
          $installedExecutable = Get-ChildItem -LiteralPath $installRoot -Filter 'deltamod-tauri-shell.exe' -File -Recurse | Select-Object -First 1
          if (-not $installedExecutable) { throw 'The installed Tauri executable was not found.' }
          node scripts/tauri-parity/run-packaged-smoke.js `
            --executable $installedExecutable.FullName `
            --data-root $dataRoot `
            --timeout-ms 30000 `
            --ready-for-ms 1500 `
            --capability-probe `
            --expected-version "${{ needs.validate.outputs.release_version }}" `
            --evidence-file "packaged-smoke-${{ matrix.target }}.json"
          if ($LASTEXITCODE -ne 0) { throw "Packaged smoke failed with exit code $LASTEXITCODE" }
          $protocolDataRoot = Join-Path $env:RUNNER_TEMP "deltamod-protocol-${{ matrix.target }}"
          pwsh -NoLogo -NoProfile -NonInteractive -File scripts/tauri-parity/run-installed-protocol-smoke.ps1 `
            -Executable $installedExecutable.FullName `
            -DataRoot $protocolDataRoot `
            -TimeoutMs 30000 `
            -ExpectedVersion "${{ needs.validate.outputs.release_version }}" `
            -EvidenceFile "packaged-protocol-${{ matrix.target }}.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed protocol smoke failed with exit code $LASTEXITCODE" }
          node scripts/tauri-parity/run-installed-sidecar-smoke.js `
            --install-root $installRoot `
            --target "${{ matrix.target }}" `
            --evidence-file "packaged-sidecars-${{ matrix.target }}.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed sidecar smoke failed with exit code $LASTEXITCODE" }
          $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'uninstall*.exe' -File -Recurse | Select-Object -First 1
          if (-not $uninstaller) { throw 'The NSIS uninstaller was not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $dataRoot -PathType Container)) { throw 'Uninstall removed the disposable user-data root.' }
      - name: Install, smoke, and uninstall Linux deb package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package_path"
          package_name="$(dpkg-deb --field "$package_path" Package)"
          data_root="$RUNNER_TEMP/deltamod-smoke-${{ matrix.target }}"
          mkdir -p "$data_root"
          sudo dpkg --install "$package_path"
          installed_executable="$(command -v deltamod-tauri-shell)"
          test -x "$installed_executable"
          xvfb-run -a node scripts/tauri-parity/run-packaged-smoke.js \
            --executable "$installed_executable" \
            --data-root "$data_root" \
            --timeout-ms 30000 \
            --ready-for-ms 1500 \
            --capability-probe \
            --expected-version "${{ needs.validate.outputs.release_version }}" \
            --evidence-file "packaged-smoke-${{ matrix.target }}.json"
          protocol_data_root="$RUNNER_TEMP/deltamod-protocol-${{ matrix.target }}"
          mkdir -p "$protocol_data_root"
          xvfb-run -a node scripts/tauri-parity/run-installed-unix-protocol-smoke.js \
            --platform linux \
            --executable "$installed_executable" \
            --data-root "$protocol_data_root" \
            --timeout-ms 30000 \
            --expected-version "${{ needs.validate.outputs.release_version }}" \
            --evidence-file "packaged-protocol-${{ matrix.target }}.json"
          node scripts/tauri-parity/run-installed-sidecar-smoke.js \
            --install-root "$(dirname "$installed_executable")" \
            --target "${{ matrix.target }}" \
            --evidence-file "packaged-sidecars-${{ matrix.target }}.json"
          sudo dpkg --remove "$package_name"
          test -d "$data_root"
      - name: Install, smoke, and uninstall macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_root="$RUNNER_TEMP/deltamod-dmg-${{ matrix.target }}"
          installed_app="/Applications/Deltamod Community.app"
          data_root="$RUNNER_TEMP/deltamod-smoke-${{ matrix.target }}"
          protocol_data_root="$RUNNER_TEMP/deltamod-protocol-${{ matrix.target }}"
          mkdir -p "$mount_root" "$data_root" "$protocol_data_root"
          test ! -e "$installed_app"
          # `yes` is expected to receive SIGPIPE after hdiutil accepts the
          # embedded licence. Inspect hdiutil's status instead of failing the
          # whole pipe under `set -o pipefail` after a successful mount.
          set +o pipefail
          yes | hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_root"
          attach_status="${PIPESTATUS[1]}"
          set -o pipefail
          test "$attach_status" -eq 0
          cleanup() {
            hdiutil detach "$mount_root" >/dev/null 2>&1 || true
            sudo rm -rf -- "$installed_app"
          }
          trap cleanup EXIT
          sudo ditto "$mount_root/Deltamod Community.app" "$installed_app"
          bundle_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$installed_app/Contents/Info.plist")"
          test -n "$bundle_executable"
          test "$(basename "$bundle_executable")" = "$bundle_executable"
          installed_executable="$installed_app/Contents/MacOS/$bundle_executable"
          test -x "$installed_executable"
          node scripts/tauri-parity/run-packaged-smoke.js \
            --executable "$installed_executable" \
            --data-root "$data_root" \
            --timeout-ms 30000 \
            --ready-for-ms 1500 \
            --capability-probe \
            --expected-version "${{ needs.validate.outputs.release_version }}" \
            --evidence-file "packaged-smoke-${{ matrix.target }}.json"
          node scripts/tauri-parity/run-installed-unix-protocol-smoke.js \
            --platform macos \
            --app-bundle "$installed_app" \
            --executable "$installed_executable" \
            --data-root "$protocol_data_root" \
            --timeout-ms 30000 \
            --expected-version "${{ needs.validate.outputs.release_version }}" \
            --evidence-file "packaged-protocol-${{ matrix.target }}.json"
          node scripts/tauri-parity/run-installed-sidecar-smoke.js \
            --install-root "$(dirname "$installed_executable")" \
            --target "${{ matrix.target }}" \
            --evidence-file "packaged-sidecars-${{ matrix.target }}.json"
          hdiutil detach "$mount_root"
          sudo rm -rf -- "$installed_app"
          trap - EXIT
          test -d "$data_root"
      - name: Stage uniquely named updater release asset
        if: runner.os != 'Linux' && needs.validate.outputs.unsigned_preview != 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          shopt -s nullglob
          if [[ "$BUILD_TARGET" == *windows* ]]; then
            extension='.exe'
            signatures=(src-tauri/target/"$BUILD_TARGET"/release/bundle/nsis/*.exe.sig)
          else
            extension='.app.tar.gz'
            signatures=(src-tauri/target/"$BUILD_TARGET"/release/bundle/macos/*.app.tar.gz.sig)
          fi
          test "${#signatures[@]}" -eq 1
          artifact="${signatures[0]%.sig}"
          destination="updater-release/Deltamod-Community_${version}_${BUILD_TARGET}${extension}"
          mkdir -p updater-release
          cp "$artifact" "$destination"
          cp "${artifact}.sig" "${destination}.sig"
      - name: Stage unsigned Windows manual-download installer
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview == 'true'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          shopt -s nullglob
          installers=(src-tauri/target/"$BUILD_TARGET"/release/bundle/nsis/*.exe)
          test "${#installers[@]}" -eq 1
          mkdir -p manual-release
          cp "${installers[0]}" "manual-release/Deltamod-Community_${version}_${BUILD_TARGET}-setup.exe"
      - name: Pin the setup payload digest
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview != 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'The Windows NSIS bundle was not found.' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "DELTAMOD_INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Deltamod-themed setup shell
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview != 'true'
        run: npm run build:installer
      - name: Sign and verify Deltamod-themed setup shell
        if: runner.os == 'Windows' && needs.validate.outputs.unsigned_preview != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter 'signtool.exe' -File -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          $setup = (Resolve-Path -LiteralPath 'dist/Deltamod Community Setup.exe').Path
          & $signtool.FullName sign /sha1 $env:DELTAMOD_WINDOWS_CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $setup
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:DELTAMOD_WINDOWS_CERT_THUMBPRINT) {
            throw 'The branded setup publisher signature is invalid.'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            updater-release/*
            manual-release/*
            dist/Deltamod Community Setup.exe
            packaged-smoke-${{ matrix.target }}.json
            packaged-protocol-${{ matrix.target }}.json
            packaged-sidecars-${{ matrix.target }}.json
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  third-party-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run archive:g3mtool-source -- "G3MTool-1.2.5-source.zip"
      - run: npm run archive:undertale-mod-tool-source -- "UndertaleModTool-0.9.1.2-source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: third-party-source
          if-no-files-found: error
          path: |
            G3MTool-1.2.5-source.zip
            UndertaleModTool-0.9.1.2-source.zip

  publish:
    needs: [validate, package, third-party-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Prepare signed updater metadata
        if: needs.validate.outputs.unsigned_preview != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: node scripts/generate-tauri-updater-manifest.js release-artifacts "$RELEASE_TAG" release-artifacts/latest.json "$RELEASE_VERSION"
      - name: Prepare SHA-256 manifest
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          if [ "${{ needs.validate.outputs.unsigned_preview }}" = true ]; then
            test "${#artifacts[@]}" -eq 18
            test "$(find release-artifacts -type f -name '*.exe' | wc -l)" -eq 1
            test "$(find release-artifacts -type f -name '*.deb' | wc -l)" -eq 1
            test "$(find release-artifacts -type f -name '*.dmg' | wc -l)" -eq 2
            test "$(find release-artifacts -type f -name '*.sig' | wc -l)" -eq 0
            test ! -e release-artifacts/latest.json
          else
            test "${#artifacts[@]}" -eq 25
          fi
          (
            cd release-artifacts
            while IFS= read -r -d '' artifact; do
              digest="$(sha256sum "$artifact")"
              printf '%s  %s\n' "${digest%% *}" "$(basename "$artifact")"
            done < <(find . -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          ) > release-artifacts/SHA256SUMS.txt
      - name: Prepare user-facing release notes
        if: needs.validate.outputs.rehearsal != 'true' && needs.validate.outputs.unsigned_preview != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: node scripts/render-release-notes.js "$RELEASE_TAG" CHANGELOG.txt release-notes.md
      - name: Prepare rehearsal notes
        if: needs.validate.outputs.rehearsal == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          cat > release-notes.md <<EOF
          # Signed updater rehearsal ${RELEASE_VERSION}

          This prerelease is an isolated CI rehearsal from commit \`${GITHUB_SHA}\`.
          It is not a stable release and is not served by the public \`releases/latest\` updater endpoint.

          Rehearsal tag: \`${RELEASE_TAG}\`
          EOF
      - name: Prepare unsigned preview notes
        if: needs.validate.outputs.unsigned_preview == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          node scripts/render-release-notes.js "community-v${RELEASE_VERSION}" CHANGELOG.txt preview-changes.md
          cat > release-notes.md <<EOF
          # Deltamod Community ${RELEASE_VERSION} unsigned Tauri preview

          **Warning:** These Tauri packages are intentionally unsigned and the macOS builds are not notarized. Windows SmartScreen and macOS Gatekeeper warnings are expected.

          This is a manual-download prerelease from commit \`${GITHUB_SHA}\`. Automatic updates are disabled for these artifacts: the release contains no \`latest.json\` and no Tauri updater signatures.

          Preview tag: \`${RELEASE_TAG}\`

          EOF
          tail -n +2 preview-changes.md | sed "s/community-v${RELEASE_VERSION}/${RELEASE_TAG}/g" >> release-notes.md
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
      - name: Publish stable signed release
        if: needs.validate.outputs.rehearsal != 'true' && needs.validate.outputs.unsigned_preview != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          test "${#artifacts[@]}" -eq 26
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --verify-tag --latest --notes-file release-notes.md --title "Deltamod Community ${RELEASE_TAG#community-v}"
      - name: Publish isolated signed updater rehearsal
        if: needs.validate.outputs.rehearsal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          test "${#artifacts[@]}" -eq 26
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes-file release-notes.md \
            --title "Signed updater rehearsal ${RELEASE_VERSION} (run ${GITHUB_RUN_ID})"
      - name: Publish unsigned Tauri preview
        if: needs.validate.outputs.unsigned_preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -type f -print0)
          test "${#artifacts[@]}" -eq 19
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --verify-tag \
            --prerelease \
            --notes-file release-notes.md \
            --title "Deltamod Community ${RELEASE_VERSION} (Unsigned Tauri Preview)"
