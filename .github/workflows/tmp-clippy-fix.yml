name: Temporary clippy lifetime fix

on:
  push:
    branches:
      - fix/reliability-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/reliability-findings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact lifetime fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/crates/archive-import-runtime/src/lib.rs')
          text = path.read_text()
          old = '    commit_with_cleanup(source, destination, replacing, fs::remove_dir_all)\n'
          new = '    commit_with_cleanup(source, destination, replacing, |path| fs::remove_dir_all(path))\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all --manifest-path src-tauri/Cargo.toml
          test "$(git diff --name-only)" = "src-tauri/crates/archive-import-runtime/src/lib.rs"
      - name: Verify focused crate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p deltamod-archive-import-runtime --all-targets -- -D warnings
      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/crates/archive-import-runtime/src/lib.rs
          git commit -m "fix: satisfy cleanup callback lifetime"
          git push origin HEAD:fix/reliability-findings
