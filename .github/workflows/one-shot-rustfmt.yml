# Registered-workflow retrigger for the Tauri rustfmt fix.
name: One-shot Tauri rustfmt fix

on:
  push:
    branches: [DeltaMaster]
    paths:
      - .github/workflows/one-shot-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: DeltaMaster
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Tauri Rust workspace
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Verify Tauri Rust formatting
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - run: git diff --check
      - name: Commit rustfmt-only fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/channels/mods.rs src-tauri/src/local_import.rs .github/workflows/one-shot-rustfmt.yml
          git commit -m "style: format Tauri Rust sources"
          git push origin HEAD:DeltaMaster
