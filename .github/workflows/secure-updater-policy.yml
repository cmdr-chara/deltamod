name: Secure Updater Policy

on:
  push:
    branches:
      - DeltaMaster
  pull_request:
    branches:
      - DeltaMaster
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Self-test updater policy
        run: node scripts/verify-secure-updater-config.js --self-test
      - name: Verify updater configuration
        run: node scripts/verify-secure-updater-config.js
