name: Temporary Chara CI Autofix

on:
  push:
    branches:
      - cmdr-chara/roadmap-contract-freeze

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cmdr-chara/roadmap-contract-freeze
          fetch-depth: 0
      - name: Patch Chara encounter state deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('web/views/themesel/index.js')
          text = path.read_text(encoding='utf-8')
          if 'let charaEncounterActive = false;' in text:
              print('Chara state fix already present.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    let charaUnlocked = false;\n    let pendingCharaToken = null;",
              "    let charaUnlocked = false;\n    let charaEncounterActive = false;\n    let pendingCharaToken = null;",
              'encounter state declaration'
          )
          replace_once(
              "        .then(value => {\n            charaUnlocked = Boolean(value);\n            charaDetected = charaUnlocked;\n            return charaUnlocked;\n        })",
              "        .then(value => {\n            charaUnlocked = Boolean(value);\n            return charaUnlocked;\n        })",
              'unlock initialization'
          )
          replace_once(
              "    const themeFilterPlaceholder = () => charaUnlocked\n        ? t('theme_filter_placeholder', 'Name, description, or music')\n        : 'THE TRUE NAME';",
              "    const themeFilterPlaceholder = () => charaEncounterActive\n        ? 'THE TRUE NAME'\n        : t('theme_filter_placeholder', 'Name, description, or music');\n    const refreshThemeFilterPlaceholder = () => {\n        const filter = document.getElementById('theme-filter');\n        if (filter) filter.placeholder = themeFilterPlaceholder();\n    };",
              'placeholder state'
          )
          replace_once(
              "    (async () => {\n        const [availableThemes, currentTheme] = await Promise.all([",
              "    (async () => {\n        refreshThemeFilterPlaceholder();\n        const [availableThemes, currentTheme] = await Promise.all([",
              'initial placeholder hydration'
          )
          replace_once(
              "    async function startCharaEasterEgg() {\n        await charaUnlockReady;\n        if (charaUnlocked) return;\n        const sessionToken = charaSessionGate.begin();\n        if (!sessionToken) return;\n        charaDetected = true;",
              "    async function startCharaEasterEgg() {\n        if (charaDetected) return;\n        charaDetected = true;\n        await charaUnlockReady;\n        const sessionToken = charaSessionGate.begin();\n        if (!sessionToken) {\n            charaDetected = false;\n            return;\n        }",
              'encounter start gate'
          )
          replace_once(
              "        try {\n            await window.deltamodBackend.invoke('setUniqueFlag', [CHARA_UNLOCK_FLAG, true]);\n        } catch (error) {\n            console.error('Unable to persist the Chara theme unlock:', error);\n            charaSessionGate.cancel(sessionToken);\n            charaDetected = false;\n            pendingCharaToken = null;\n            return;\n        }\n        if (!charaSessionGate.isCurrent(sessionToken)) return;\n        charaUnlocked = true;\n        pendingCharaToken = null;",
              "        if (!charaUnlocked) {\n            try {\n                await window.deltamodBackend.invoke('setUniqueFlag', [CHARA_UNLOCK_FLAG, true]);\n            } catch (error) {\n                console.error('Unable to persist the Chara theme unlock:', error);\n                charaSessionGate.cancel(sessionToken);\n                charaDetected = false;\n                pendingCharaToken = null;\n                return;\n            }\n        }\n        if (!charaSessionGate.isCurrent(sessionToken)) return;\n        charaUnlocked = true;\n        charaEncounterActive = true;\n        pendingCharaToken = null;",
              'unlock persistence'
          )
          replace_once(
              "            overlay.remove();\n            document.body.classList.remove('chara-sequence-active');\n            if (themeFilter) {\n                themeFilter.placeholder = themeFilterPlaceholder();\n            }",
              "            overlay.remove();\n            document.body.classList.remove('chara-sequence-active');\n            charaEncounterActive = false;\n            refreshThemeFilterPlaceholder();",
              'encounter cleanup placeholder'
          )
          replace_once(
              "            charaSessionGate.cancel(sessionToken);\n            charaDetected = true;\n            charaBuffer = '';",
              "            charaSessionGate.cancel(sessionToken);\n            charaDetected = false;\n            charaBuffer = '';",
              'encounter cleanup gate'
          )

          path.write_text(text, encoding='utf-8')
          PY
          node --check web/views/themesel/index.js
          git diff --check
          git diff -- web/views/themesel/index.js
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/views/themesel/index.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/views/themesel/index.js
          git commit -m 'fix: stabilize Chara encounter state'
          git push origin HEAD:cmdr-chara/roadmap-contract-freeze
