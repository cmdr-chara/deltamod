name: Original frontend refinement
on:
  pull_request:
    paths: ['web/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', 'vite.boot.config.js', '.github/workflows/frontend-refinement.yml']
  push:
    branches: [DeltaMaster]
    paths: ['web/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'playwright.config.js', 'vite.boot.config.js', '.github/workflows/frontend-refinement.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install browser-test dependencies
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "npm ci" -- npm ci --no-audit --no-fund
      - run: npm run build:boot
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "Playwright installation" -- npx playwright install --with-deps chromium
      # The four-platform Community CI matrix owns unit tests and native builds.
      - name: Original UI behavior and theme contracts
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ci-results/playwright.xml
        run: npm run test:e2e -- --reporter=line,junit
      - name: UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-frontend-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
