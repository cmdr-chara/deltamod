name: Original frontend refinement
on:
  pull_request:
    paths: ['web/**', 'tests/**', 'scripts/tauri-parity/fixtures/test-classification.json', '.github/workflows/frontend-refinement.yml']
  push:
    branches: [frontend-refinement]
    paths: ['web/**', 'tests/**', '.github/workflows/frontend-refinement.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/retry-command.js --label "npm ci" -- npm ci
      - run: npm run typecheck
      - run: npm run build:boot
      - run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Original UI behavior and theme contracts
        run: npx playwright test tests/e2e/frontend-refinement.spec.js tests/e2e/tauri-themes.spec.js tests/e2e/tauri-localization.spec.js
      - name: UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-frontend-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
