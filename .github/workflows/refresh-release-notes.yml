name: Refresh published release notes

on:
  push:
    branches:
      - fix/release-publisher-recovery
    paths:
      - .github/workflows/refresh-release-notes.yml
      - .github/release-notes/community-v2.0.13.md
      - .github/release-notes/community-v2.0.14.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Replace raw changelog dumps with user-facing notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in community-v2.0.13 community-v2.0.14; do
            notes=".github/release-notes/$tag.md"
            test -s "$notes"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              echo "Updated release notes for $tag"
            else
              echo "$tag is not published yet; leaving its prepared notes in the repository."
            fi
          done
