name: Community CI

on:
  push:
    branches: [DeltaMaster]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Also build and measure an unsigned Windows diagnostic package (not a release)'
        type: boolean
        default: false

# Superseded PR checks can stop. Main-branch release preparation cannot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: rustfmt
      - name: Install npm dependencies
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "npm ci" -- npm ci --no-audit --no-fund
      - name: Lint workflows and test the CI result gate
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/ci.yml .github/workflows/frontend-refinement.yml \
            .github/workflows/provenance.yml .github/workflows/secure-updater-policy.yml
          node --test scripts/ci/gate.test.cjs
      - run: npm run verify:tauri-only
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm run verify:g3mtool-manifest
      - run: npm run verify:undertale-mod-tool-manifest
      - run: npm run verify:tauri:contract
      - run: cargo fmt --all --check --manifest-path native/Cargo.toml
      - run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

  verify:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAURI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Restore Rust dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            native -> target
            src-tauri -> target
          # PR merge-ref caches are isolated from the base branch. Only save
          # successful main/same-repository PR builds, never fork contributions.
          save-if: ${{ github.ref == 'refs/heads/DeltaMaster' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - name: Install Linux Tauri dependencies
        timeout-minutes: 16
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners prefer an Azure mirror through apt-mirrors.txt. If that
          # regional mirror stalls, apt can wait indefinitely even after finding
          # archive.ubuntu.com. Pin the Ubuntu archive to the canonical HTTPS mirror
          # and bound network operations so CI fails fast instead of hanging.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              "$source"
          done
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install npm dependencies
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "npm ci" -- npm ci --no-audit --no-fund
      - name: Acquire G3MTool
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "G3MTool acquisition" -- npm run acquire:g3mtool
      - name: Acquire UndertaleModTool
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "UndertaleModTool acquisition" -- npm run acquire:undertale-mod-tool
        if: matrix.target != 'aarch64-apple-darwin'
      - name: Initialize diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          {
            git rev-parse HEAD
            node --version
            rustc --version --verbose
            printf 'Target: %s\n' "$TAURI_BUILD_TARGET"
          } > ci-results/environment.txt
      - run: npm run build:boot
      - run: npm run build:native-sidecars:target -- ${{ matrix.target }}
      - run: npm run build:tauri:resources -- ${{ matrix.target }}
      - name: Native worker Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked --manifest-path native/Cargo.toml -- -D warnings 2>&1 | tee ci-results/native-clippy.log
      - name: Native worker tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked --manifest-path native/Cargo.toml 2>&1 | tee ci-results/native-tests.log
      - name: Build debug workers for JavaScript integration tests
        run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - name: Run platform-sensitive JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=ci-results/vitest.xml 2>&1 | tee ci-results/javascript-tests.log
      - name: Tauri workspace Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee ci-results/tauri-clippy.log
      - name: Tauri workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee ci-results/tauri-tests.log
      - name: Install Playwright Chromium
        timeout-minutes: 5
        if: runner.os == 'macOS'
        run: node scripts/retry-command.js --label "Playwright Chromium installation" -- npx playwright install chromium
      - name: Renderer and Tauri browser E2E
        id: renderer_e2e
        if: runner.os == 'macOS'
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ci-results/playwright.xml
        run: npm run test:e2e -- --reporter=line,junit
      - name: Native tool smoke checks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # These exact tools were acquired and staged above. Verify, do not reacquire.
          npm run verify:g3mtool
          if [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "ARM64" ]]; then
            echo "UndertaleModTool CSX is intentionally unavailable on macOS ARM."
          else
            npm run verify:undertale-mod-tool
            npm run smoke:game-patching-csx
          fi
      - name: Upload target diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ci-results/
            test-results/

  ci-result:
    name: Native CI result
    if: ${{ always() }}
    needs: [quality, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require every native validation job to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.cjs quality verify

  benchmark-on-failure:
    needs: verify
    name: Optional Windows benchmark
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.benchmark && needs.verify.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_BUILD_TARGET: x86_64-pc-windows-msvc
      BENCHMARK_INCLUDED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install npm dependencies
        timeout-minutes: 5
        run: node scripts/retry-command.js --label "npm ci" -- npm ci --no-audit --no-fund
      - name: Acquire benchmark resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/retry-command.js --label "G3MTool acquisition" -- npm run acquire:g3mtool
          if ($LASTEXITCODE -ne 0) { throw "G3MTool acquisition failed with exit code $LASTEXITCODE" }
          node scripts/retry-command.js --label "UndertaleModTool acquisition" -- npm run acquire:undertale-mod-tool
          if ($LASTEXITCODE -ne 0) { throw "UndertaleModTool acquisition failed with exit code $LASTEXITCODE" }
      - name: Capture Windows packaged Tauri benchmark diagnostic
        id: benchmark
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'deltamod-ci-benchmark'
          $installRoot = Join-Path $env:RUNNER_TEMP 'deltamod-ci-benchmark-install'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          try {
            # CI diagnostics are unsigned and must not attempt updater artifact signing.
            node -e "const fs = require('node:fs'); const p = 'src-tauri/tauri.windows.conf.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.bundle.createUpdaterArtifacts = false; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
            if ($LASTEXITCODE -ne 0) { throw "Failed to disable updater signing for the diagnostic package" }

            npm run build:boot
            if ($LASTEXITCODE -ne 0) { throw "Boot build failed with exit code $LASTEXITCODE" }
            npm run build:native-sidecars:target -- x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Native sidecar staging failed with exit code $LASTEXITCODE" }
            npm run build:tauri:resources -- x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Tauri resource staging failed with exit code $LASTEXITCODE" }
            npm run build:tauri:butler -- x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Butler staging failed with exit code $LASTEXITCODE" }
            npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed with exit code $LASTEXITCODE" }

            $bundle = Get-ChildItem -LiteralPath 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File |
              Select-Object -First 1
            if (-not $bundle) { throw 'The benchmark NSIS bundle was not found.' }
            New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
            $installer = Start-Process -FilePath $bundle.FullName -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru -WindowStyle Hidden
            if ($installer.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($installer.ExitCode)" }

            $installedExecutable = Get-ChildItem -LiteralPath $installRoot -Filter 'deltamod-tauri-shell.exe' -File -Recurse |
              Select-Object -First 1
            if (-not $installedExecutable) { throw 'The installed benchmark executable was not found.' }

            $shortRevision = if ($env:BENCHMARK_INCLUDED_REVISION.Length -gt 12) {
              $env:BENCHMARK_INCLUDED_REVISION.Substring(0, 12)
            } else {
              $env:BENCHMARK_INCLUDED_REVISION
            }
            $resultPath = Join-Path $outputRoot "tauri-windows-$shortRevision.json"
            node scripts/desktop-benchmark/capture-windows.js `
              --executable $installedExecutable.FullName `
              --artifact $bundle.FullName `
              --output $resultPath `
              --readiness-file '{readyFile}' `
              --includes-revision $env:BENCHMARK_INCLUDED_REVISION
            if ($LASTEXITCODE -ne 0) { throw "Benchmark capture failed with exit code $LASTEXITCODE" }
          }
          catch {
            $_ | Out-String | Set-Content -LiteralPath (Join-Path $outputRoot 'benchmark-error.txt') -Encoding utf8
            throw
          }
          finally {
            if (Test-Path -LiteralPath $installRoot) {
              $uninstaller = Get-ChildItem -LiteralPath $installRoot -Filter 'uninstall*.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($uninstaller) {
                Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue
              }
            }
          }
      - name: Upload optional benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-diagnostic-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/deltamod-ci-benchmark/*
      - name: Summarize benchmark diagnostic
        if: always()
        shell: pwsh
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Optional Windows benchmark'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Capture outcome: ``$env:BENCHMARK_OUTCOME``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'The raw result is diagnostic only; GitHub-hosted runner hardware is not treated as comparable to the committed same-host release baseline.'

  prepare-stable-release:
    needs: ci-result
    if: github.event_name == 'push' && github.ref == 'refs/heads/DeltaMaster'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deltamod-stable-release-preparation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Refuse stale or non-release candidates
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin DeltaMaster --tags --force
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          current="$(git rev-parse origin/DeltaMaster)"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer DeltaMaster commit exists; its CI run owns the next release."
            exit 0
          fi

          if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$VALIDATED_SHA")"
            release_relevant=false
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                .github/*|docs/*|*.md|CHANGELOG.txt|scripts/archive-g3mtool-source.js|scripts/archive-undertale-mod-tool-source.js|scripts/render-release-notes.js)
                  ;;
                *)
                  release_relevant=true
                  break
                  ;;
              esac
            done <<< "$changed"
            if [ "$release_relevant" != "true" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Only documentation or release-infrastructure files changed; no application release is required."
              exit 0
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Resolve stable release version
        if: steps.candidate.outputs.release == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Stable releases require x.y.z; found $current" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$current"
          while git rev-parse "community-v$version" >/dev/null 2>&1; do
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=community-v$version" >> "$GITHUB_OUTPUT"

      - name: Synchronize release manifests
        if: steps.candidate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          python - <<'PY'
          import os
          import re
          import subprocess
          from datetime import date
          from pathlib import Path

          version = os.environ['VERSION']
          sha = os.environ['VALIDATED_SHA']

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('could not update src-tauri/Cargo.toml package version')
          cargo.write_text(text, encoding='utf-8')

          lock = Path('src-tauri/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          pattern = r'(\[\[package\]\]\nname = "deltamod-tauri-shell"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
          if count != 1:
            raise SystemExit('could not update src-tauri/Cargo.lock shell version')
          lock.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.txt')
          previous = changelog.read_text(encoding='utf-8')
          if previous.startswith(f'# Deltamod Community {version}\n'):
              raise SystemExit(0)

          tags = subprocess.check_output(
              ['git', 'tag', '--list', 'community-v*', '--sort=-v:refname'], text=True
          ).splitlines()
          revision = f'{tags[0]}..{sha}' if tags else sha
          log = subprocess.check_output(
              ['git', 'log', revision, '--format=%s%x09%h'], text=True
          ).splitlines()
          changes = []
          for line in reversed(log):
              subject, _, short = line.partition('\t')
              if subject.startswith('chore(release):'):
                  continue
              changes.append(f'- {subject} (`{short}`).')
          if not changes:
              changes.append(f'- Verified maintenance update (`{sha[:12]}`).')

          section = (
              f'# Deltamod Community {version}\n\n'
              f'Released {date.today().isoformat()}.\n\n'
              f'## Changes\n\n' + '\n'.join(changes) + '\n\n'
          )
          changelog.write_text(section + previous, encoding='utf-8')
          PY

      - name: Commit detached release metadata, tag, and dispatch stable release
        if: steps.candidate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.txt
          if ! git diff --cached --quiet; then
            # Branch protection requires DeltaMaster changes to flow through PRs.
            # Keep generated release metadata in a detached commit reachable from
            # the immutable release tag instead of pushing it back to DeltaMaster.
            git commit -m "chore(release): Deltamod Community ${VERSION} [skip ci]"
          fi
          release_sha="$(git rev-parse HEAD)"
          git fetch origin --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing stable tag $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$release_sha"
          git push origin "refs/tags/$TAG"
          gh workflow run tauri-release.yml --ref "$TAG"
