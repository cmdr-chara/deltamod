name: Community CI

on:
  push:
    branches: [DeltaMaster]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAURI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners prefer an Azure mirror through apt-mirrors.txt. If that
          # regional mirror stalls, apt can wait indefinitely even after finding
          # archive.ubuntu.com. Pin the Ubuntu archive to the canonical HTTPS mirror
          # and bound network operations so CI fails fast instead of hanging.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
              "$source"
          done
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install npm dependencies
        run: node scripts/retry-command.js --label "npm ci" -- npm ci
      - name: Acquire G3MTool
        run: node scripts/retry-command.js --label "G3MTool acquisition" -- npm run acquire:g3mtool
      - name: Acquire UndertaleModTool
        run: node scripts/retry-command.js --label "UndertaleModTool acquisition" -- npm run acquire:undertale-mod-tool
        if: matrix.target != 'aarch64-apple-darwin'
      - run: npm run build:native-sidecars:target -- ${{ matrix.target }}
      - run: npm run build:tauri:resources -- ${{ matrix.target }}
      - run: cargo fmt --all --check --manifest-path native/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --workspace --locked --manifest-path native/Cargo.toml
      - run: cargo build --workspace --locked --manifest-path native/Cargo.toml
      - run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml
      - run: npm test
      - run: npm run typecheck
      - run: npm run security:audit
      - run: npm run verify:g3mtool-manifest
      - run: npm run verify:undertale-mod-tool-manifest
      - name: Install Playwright Chromium
        if: runner.os == 'macOS'
        run: node scripts/retry-command.js --label "Playwright Chromium installation" -- npx playwright install chromium
      - name: Electron workflow smoke test
        if: runner.os == 'macOS'
        run: npm run test:e2e
      - name: Package smoke build
        shell: bash
        run: |
          node scripts/retry-command.js --label "G3MTool acquisition" -- npm run acquire:g3mtool
          npm run verify:g3mtool
          if [[ "$RUNNER_OS" == "macOS" && "$RUNNER_ARCH" == "ARM64" ]]; then
            node scripts/retry-command.js --label "UndertaleModTool Intel acquisition" -- node scripts/acquire-undertale-mod-tool.js darwin-x64
            node scripts/verify-undertale-mod-tool.js darwin-x64 --tree-only
          else
            node scripts/retry-command.js --label "UndertaleModTool acquisition" -- npm run acquire:undertale-mod-tool
            npm run verify:undertale-mod-tool
            npm run smoke:game-patching-csx
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npm run build:native-sidecars
            node scripts/retry-command.js --label "Electron Windows package build" -- npx electron-builder --win --dir --publish never
            node scripts/verify-packaged-hash-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
            node scripts/verify-packaged-security-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
            node scripts/verify-packaged-copy-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
            node scripts/verify-packaged-patch-plan-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
            node scripts/verify-packaged-patch-transaction-worker.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
            node scripts/verify-packaged-undertale-mod-tool.js "dist/win-unpacked/resources/app.asar.unpacked" win32-x64
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            node scripts/retry-command.js --label "Electron macOS package build" -- npx electron-builder --mac --arm64 --dir --publish never
            node scripts/verify-packaged-undertale-mod-tool.js "dist/mac-arm64/Deltamod Community.app/Contents/Resources/app.asar.unpacked" darwin-x64 --tree-only
          else
            node scripts/retry-command.js --label "Electron Linux package build" -- npx electron-builder --linux --dir --publish never
            node scripts/verify-packaged-undertale-mod-tool.js "dist/linux-unpacked/resources/app.asar.unpacked" linux-x64
          fi

  verify-csx-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: node scripts/retry-command.js --label "npm ci" -- npm ci
      - name: Acquire UndertaleModTool
        run: node scripts/retry-command.js --label "UndertaleModTool acquisition" -- npm run acquire:undertale-mod-tool
      - run: npm run verify:undertale-mod-tool
      - name: Acquire G3MTool
        run: node scripts/retry-command.js --label "G3MTool acquisition" -- npm run acquire:g3mtool
      - run: npm run verify:g3mtool
      - run: npm run smoke:game-patching-csx
      - run: npm run build:boot
      - run: node scripts/retry-command.js --label "Electron macOS Intel package build" -- npx electron-builder --mac --x64 --dir --publish never
      - run: node scripts/verify-packaged-undertale-mod-tool.js "dist/mac/Deltamod Community.app/Contents/Resources/app.asar.unpacked" darwin-x64

  prepare-stable-release:
    needs: [verify, verify-csx-macos-intel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/DeltaMaster'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out validated DeltaMaster
        uses: actions/checkout@v6
        with:
          ref: DeltaMaster
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refuse stale or non-release candidates
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin DeltaMaster --tags --force
          current="$(git rev-parse origin/DeltaMaster)"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer DeltaMaster commit exists; its CI run owns the next release."
            exit 0
          fi

          if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$VALIDATED_SHA")"
            release_relevant=false
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                .github/*|docs/*|*.md|CHANGELOG.txt|scripts/archive-g3mtool-source.js|scripts/archive-undertale-mod-tool-source.js|scripts/render-release-notes.js)
                  ;;
                *)
                  release_relevant=true
                  break
                  ;;
              esac
            done <<< "$changed"
            if [ "$release_relevant" != "true" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Only documentation or release-infrastructure files changed; no application release is required."
              exit 0
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Resolve stable release version
        if: steps.candidate.outputs.release == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Stable releases require x.y.z; found $current" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$current"
          while git rev-parse "community-v$version" >/dev/null 2>&1; do
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=community-v$version" >> "$GITHUB_OUTPUT"

      - name: Synchronize release manifests
        if: steps.candidate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          python - <<'PY'
          import os
          import re
          import subprocess
          from datetime import date
          from pathlib import Path

          version = os.environ['VERSION']
          sha = os.environ['VALIDATED_SHA']

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('could not update src-tauri/Cargo.toml package version')
          cargo.write_text(text, encoding='utf-8')

          lock = Path('src-tauri/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          pattern = r'(\[\[package\]\]\nname = "deltamod-tauri-shell"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
          if count != 1:
            raise SystemExit('could not update src-tauri/Cargo.lock shell version')
          lock.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.txt')
          previous = changelog.read_text(encoding='utf-8')
          if previous.startswith(f'# Deltamod Community {version}\n'):
              raise SystemExit(0)

          tags = subprocess.check_output(
              ['git', 'tag', '--list', 'community-v*', '--sort=-v:refname'], text=True
          ).splitlines()
          revision = f'{tags[0]}..{sha}' if tags else sha
          log = subprocess.check_output(
              ['git', 'log', revision, '--format=%s%x09%h'], text=True
          ).splitlines()
          changes = []
          for line in reversed(log):
              subject, _, short = line.partition('\t')
              if subject.startswith('chore(release):'):
                  continue
              changes.append(f'- {subject} (`{short}`).')
          if not changes:
              changes.append(f'- Verified maintenance update (`{sha[:12]}`).')

          section = (
              f'# Deltamod Community {version}\n\n'
              f'Released {date.today().isoformat()}.\n\n'
              f'## Changes\n\n' + '\n'.join(changes) + '\n\n'
          )
          changelog.write_text(section + previous, encoding='utf-8')
          PY

      - name: Commit detached release metadata, tag, and dispatch stable release
        if: steps.candidate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.txt
          if ! git diff --cached --quiet; then
            # Branch protection requires DeltaMaster changes to flow through PRs.
            # Keep generated release metadata in a detached commit reachable from
            # the immutable release tag instead of pushing it back to DeltaMaster.
            git commit -m "chore(release): Deltamod Community ${VERSION} [skip ci]"
          fi
          release_sha="$(git rev-parse HEAD)"
          git fetch origin --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing stable tag $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$release_sha"
          git push origin "refs/tags/$TAG"
          gh workflow run tauri-release.yml --ref "$TAG"
