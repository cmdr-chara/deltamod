name: Community CI

on:
  push:
    branches: [DeltaMaster]

permissions:
  contents: write
  actions: write

jobs:
  dispatch_bootstrap_2_0_11:
    if: contains(github.event.head_commit.message, '[community-bootstrap-2.0.11]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: DeltaMaster
      - name: Dispatch 2.0.11 bootstrap and record scheduling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run bootstrap-2.0.11.yml --ref DeltaMaster
          printf 'dispatcher_sha=%s\nstage=dispatched\n' "$GITHUB_SHA" > .github/community-bootstrap-2.0.11-dispatch.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/community-bootstrap-2.0.11-dispatch.txt
          git commit -m "ci: record Community bootstrap dispatch [skip ci]"
          git push origin HEAD:DeltaMaster
